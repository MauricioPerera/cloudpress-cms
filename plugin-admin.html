<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/admin-guard.js"></script>
<title>Plugin · CloudPress</title>
<style>html:not(.authenticated)body{visibility:hidden}body{margin:0;background:#f0f0f1;color:#1d2327;font:14px system-ui}main{max-width:1180px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.button{border:1px solid #2271b1;background:#2271b1;color:#fff;padding:8px 12px;font:inherit;cursor:pointer}.button.secondary{background:#fff;color:#2271b1}.button.danger{border-color:#b32d2e;background:#fff;color:#b32d2e}.button:disabled{opacity:.5;cursor:wait}.card{background:#fff;border:1px solid #dcdcde;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-weight:600}input,textarea,select{box-sizing:border-box;width:100%;font:inherit;padding:9px;border:1px solid #8c8f94}textarea{min-height:120px}table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:11px;border-bottom:1px solid #dcdcde}small,.muted{color:#646970}.notice{padding:12px;background:#fff;border-left:4px solid #2271b1}.notice.error{border-color:#d63638}.hidden{display:none!important}@media(max-width:700px){main{padding:16px}.grid{grid-template-columns:1fr}.head{display:block}}</style>
<main><div class="head"><div><h1 id="title">Plugin</h1><p id="summary" class="muted"></p></div><a class="button secondary" href="/wp-admin.html" target="_top">Volver al administrador</a></div><div id="notice" class="notice">Cargando contrato…</div><nav id="tabs" class="tabs card"></nav><section id="workspace"></section></main>
<script>
const $=s=>document.querySelector(s),qs=new URLSearchParams(location.search),pluginId=qs.get('plugin'),locale=qs.get('locale')||document.documentElement.lang||'es';let manifest,schema,activeType,editing=null;const api=async(path,method='GET',body)=>{const r=await fetch(path,{method,headers:{'content-type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)}),d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d};const setNotice=(message,error=false)=>{const el=$('#notice');el.textContent=message;el.className=`notice${error?' error':''}`};const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tab(id,label,fn){const button=document.createElement('button');button.className='button secondary';button.textContent=label;button.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.add('secondary'));button.classList.remove('secondary');fn()};$('#tabs').append(button);return button}
function fieldsFor(type,value={}){return schema.meta.filter(m=>m.scope==='content'&&m.plugin_id===manifest.id).map(meta=>{const key=meta.meta_key,kind=meta.value_type,current=value[key];let control;if(kind==='boolean')control=`<select form="entry" name="${escape(key)}"><option value="true" ${current===true?'selected':''}>Sí</option><option value="false" ${current===false?'selected':''}>No</option></select>`;else if(kind==='json')control=`<textarea form="entry" name="${escape(key)}">${escape(current===undefined?'':JSON.stringify(current,null,2))}</textarea>`;else control=`<input form="entry" name="${escape(key)}" type="${kind==='number'?'number':'text'}" value="${escape(current??'')}">`;return `<div class="field"><label>${escape(key.split('.').pop())}${meta.required?' *':''}</label>${control}</div>`}).join('')}
async function loadMeta(id){const data=await api(`/api/admin/plugin-meta?scope=content&id=${id}`);return Object.fromEntries(data.items.map(item=>[item.key,item.value]))}
async function renderContent(type){activeType=type;const items=(await api(`/api/admin/content?contentType=${encodeURIComponent(type.type_id)}`)).items;const area=$('#workspace');if(editing){const meta=editing.id?await loadMeta(editing.id):{};area.innerHTML=`<div class="grid"><form id="entry" class="card"><h2>${editing.id?'Editar':'Añadir'} ${escape(type.label)}</h2><div class="field"><label>Título *</label><input name="title" required value="${escape(editing.title||'')}"></div><div class="field"><label>Slug</label><input name="slug" value="${escape(editing.slug||'')}"></div><div class="field"><label>Extracto</label><textarea name="excerpt">${escape(editing.excerpt||'')}</textarea></div><div class="field"><label>Contenido</label><textarea name="body">${escape(editing.body||'')}</textarea></div><div class="field"><label>Estado</label><select name="status"><option value="draft">Borrador</option><option value="published">Publicado</option></select></div><div class="actions"><button class="button">Guardar</button><button type="button" id="cancel" class="button secondary">Cancelar</button></div></form><aside class="card"><h2>Metadatos</h2>${fieldsFor(type,meta)||'<p class="muted">Este tipo no declaró metadatos.</p>'}</aside></div>`;const form=$('#entry');form.status.value=editing.status||'draft';$('#cancel').onclick=()=>{editing=null;renderContent(type)};form.onsubmit=async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(form)),payload={kind:'post',contentType:type.type_id,title:data.title,slug:data.slug,excerpt:data.excerpt,body:data.body,status:data.status};try{const result=editing.id?await api(`/api/admin/content/${editing.id}`,'PATCH',payload):await api('/api/admin/content','POST',payload);const id=editing.id||result.id;for(const meta of schema.meta.filter(m=>m.scope==='content'&&m.plugin_id===manifest.id)){let value=data[meta.meta_key];if(meta.value_type==='number')value=Number(value);if(meta.value_type==='boolean')value=value==='true';if(meta.value_type==='json')value=value?JSON.parse(value):null;if(meta.required&&(value===''||value===null||Number.isNaN(value)))throw Error(`Falta ${meta.meta_key}`);if(value!==''&&value!==null&&!Number.isNaN(value))await api('/api/admin/plugin-meta','PUT',{scope:'content',id,key:meta.meta_key,value})}setNotice('Contenido y metadatos guardados.');editing=null;await renderContent(type)}catch(error){setNotice(error.message,true)}};return}area.innerHTML=`<div class="head"><h2>${escape(type.label)}</h2><button id="new" class="button">Añadir ${escape(type.label)}</button></div><div class="card"><table><thead><tr><th>Título</th><th>Estado</th><th>Actualizado</th><th></th></tr></thead><tbody>${items.map(item=>`<tr><td>${escape(item.title)}</td><td>${escape(item.status)}</td><td>${escape(item.updated_at)}</td><td><button data-edit="${item.id}" class="button secondary">Editar</button> <button data-trash="${item.id}" class="button danger">Papelera</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">No hay elementos todavía.</td></tr>'}</tbody></table></div>`;$('#new').onclick=()=>{editing={status:'draft'};renderContent(type)};area.querySelectorAll('[data-edit]').forEach(button=>button.onclick=()=>{editing=items.find(item=>item.id===Number(button.dataset.edit));renderContent(type)});area.querySelectorAll('[data-trash]').forEach(button=>button.onclick=async()=>{if(!await CloudPressUI.confirm({title:'Enviar a papelera',message:'Podrás restaurarlo desde Papelera.',confirmLabel:'Enviar a papelera',destructive:true}))return;await api(`/api/admin/content/${button.dataset.trash}`,'DELETE');setNotice('Contenido enviado a papelera.');renderContent(type)})}
function inputFor(action){return Object.entries(action.inputSchema?.properties||{}).map(([key,rule])=>`<div class="field"><label>${escape(key)}${action.inputSchema.required?.includes(key)?' *':''}</label><input name="${escape(key)}" type="${rule.type==='number'?'number':'text'}" ${rule.maxLength?`maxlength="${rule.maxLength}"`:''}></div>`).join('')}
async function renderActions(){const actions=manifest.actions||[];$('#workspace').innerHTML=`<div class="card"><h2>Acciones</h2>${actions.map(action=>`<form class="plugin-action card" data-id="${escape(action.id)}"><h3>${escape(action.label)}</h3>${inputFor(action)}<button class="button">Ejecutar</button><pre class="muted"></pre></form>`).join('')||'<p class="muted">No hay acciones declaradas.</p>'}</div>`;document.querySelectorAll('.plugin-action').forEach(form=>form.onsubmit=async event=>{event.preventDefault();const action=actions.find(item=>item.id===form.dataset.id),raw=Object.fromEntries(new FormData(form)),payload={};for(const [key,rule] of Object.entries(action.inputSchema?.properties||{}))payload[key]=rule.type==='number'?Number(raw[key]):raw[key];try{const result=await api(`/api/admin/plugins/${encodeURIComponent(manifest.id)}/actions/${encodeURIComponent(action.id)}`,'POST',payload);form.querySelector('pre').textContent=JSON.stringify(result.result,null,2);setNotice(`Acción ${action.label} completada.`)}catch(error){setNotice(error.message,true)}})}
async function renderTaxonomies(){const area=$('#workspace');area.innerHTML='<div class="card">Cargando taxonomías…</div>';const groups=await Promise.all((schema.taxonomies||[]).filter(t=>t.plugin_id===manifest.id).map(async definition=>({definition,items:(await api(`/api/admin/plugins/${manifest.id}/taxonomies/${definition.taxonomy_id}`)).items})));area.innerHTML=groups.map(({definition,items})=>`<section class="card"><h2>${escape(definition.label)}</h2><form data-taxonomy="${escape(definition.taxonomy_id)}" class="actions"><input name="name" placeholder="Nuevo término" required><button class="button">Añadir</button></form><ul>${items.map(item=>`<li>${escape(item.name)} <button data-term="${item.id}" data-taxonomy="${escape(definition.taxonomy_id)}" class="button danger">Eliminar</button></li>`).join('')||'<li class="muted">Sin términos.</li>'}</ul></section>`).join('')||'<div class="card muted">El plugin no declaró taxonomías.</div>';area.querySelectorAll('form[data-taxonomy]').forEach(form=>form.onsubmit=async event=>{event.preventDefault();await api(`/api/admin/plugins/${manifest.id}/taxonomies/${form.dataset.taxonomy}`,'POST',{name:new FormData(form).get('name')});setNotice('Término creado.');renderTaxonomies()});area.querySelectorAll('[data-term]').forEach(button=>button.onclick=async()=>{if(!await CloudPressUI.confirm({title:'Eliminar término',message:'La clasificación se retirará de los elementos asociados.',confirmLabel:'Eliminar',destructive:true}))return;await api(`/api/admin/plugins/${manifest.id}/taxonomies/${button.dataset.taxonomy}/${button.dataset.term}`,'DELETE');setNotice('Término eliminado.');renderTaxonomies()})}
async function renderDiagnostics(){const area=$('#workspace');area.innerHTML='<section class="card"><h2>Diagnóstico</h2><p class="muted">La ejecución se registra en la auditoría del plugin.</p><button id="run-diagnostics" class="button">Ejecutar diagnóstico</button><pre id="diagnostics-result" class="muted"></pre></section>';$('#run-diagnostics').onclick=async()=>{try{const result=await api(`/api/admin/plugins/${manifest.id}/diagnostics`);$('#diagnostics-result').textContent=JSON.stringify(result.result,null,2);setNotice('Diagnóstico completado.')}catch(error){setNotice(error.message,true)}}}
async function renderPrivacy(){const area=$('#workspace');area.innerHTML='<section class="card"><h2>Privacidad</h2><p class="muted">Exporta o borra los registros personales declarados por este plugin. El borrado requiere confirmación.</p><form id="privacy-form" class="actions"><input name="userId" type="number" min="1" placeholder="ID de usuario" required><button class="button">Exportar datos</button><button type="button" id="erase-personal" class="button danger">Borrar datos del plugin</button></form><pre id="privacy-result" class="muted"></pre></section>';const form=$('#privacy-form'),id=()=>Number(new FormData(form).get('userId'));form.onsubmit=async event=>{event.preventDefault();try{const result=await api(`/api/admin/plugins/${manifest.id}/privacy/${id()}`);$('#privacy-result').textContent=JSON.stringify(result,null,2);setNotice('Exportación generada.')}catch(error){setNotice(error.message,true)}};$('#erase-personal').onclick=async()=>{if(!await CloudPressUI.confirm({title:'Borrar datos personales del plugin',message:'Se eliminarán los registros del plugin asociados a este usuario. La cuenta no se eliminará.',confirmLabel:'Borrar datos',destructive:true}))return;try{const result=await api(`/api/admin/plugins/${manifest.id}/privacy/${id()}`,'DELETE');$('#privacy-result').textContent=JSON.stringify(result,null,2);setNotice('Datos del plugin borrados.')}catch(error){setNotice(error.message,true)}}}
async function init(){try{const suffix=`?locale=${encodeURIComponent(locale)}`, [plugins,data]=await Promise.all([api('/api/admin/plugins'+suffix),api('/api/admin/plugin-schema'+suffix)]);manifest=plugins.available.find(item=>item.id===pluginId);schema=data;if(!manifest)throw Error('Plugin no disponible.');$('#title').textContent=manifest.name;$('#summary').textContent=manifest.description;const tabs=[];(schema.contentTypes||[]).filter(type=>type.plugin_id===manifest.id).forEach(type=>tabs.push(tab(type.type_id,type.label,()=>renderContent(type))));tabs.push(tab('actions','Acciones',renderActions));tabs.push(tab('taxonomies','Taxonomías',renderTaxonomies));if(manifest.permissions.includes('diagnostics:read'))tabs.push(tab('diagnostics','Diagnóstico',renderDiagnostics));if(manifest.permissions.includes('privacy:manage'))tabs.push(tab('privacy','Privacidad',renderPrivacy));tabs[0]?.click();setNotice('Plugin cargado desde su contrato activo.')}catch(error){setNotice(error.message,true)}}init();
</script></html>
