<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/admin-guard.js"></script><title>Plugin · CloudPress</title><style>html:not(.authenticated)body{visibility:hidden}body{margin:0;background:#f0f0f1;color:#1d2327;font:14px system-ui}main{max-width:1180px;margin:auto;padding:28px}.head,.actions,.tabs{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.button{border:1px solid #2271b1;background:#2271b1;color:#fff;padding:8px 12px;font:inherit;cursor:pointer}.secondary{background:#fff;color:#2271b1}.danger{border-color:#b32d2e;background:#fff;color:#b32d2e}.card{background:#fff;border:1px solid #dcdcde;padding:18px;margin:18px 0}.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}.field{display:grid;gap:6px;margin:12px 0}input,textarea,select{box-sizing:border-box;width:100%;padding:9px;font:inherit}textarea{min-height:100px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #dcdcde}.muted{color:#646970}.notice{padding:12px;background:#fff;border-left:4px solid #2271b1}.error{border-color:#d63638}.hidden{display:none}@media(max-width:700px){main{padding:16px}.grid{grid-template-columns:1fr}}</style><main><div class="head"><div><h1 id="title">Plugin</h1><p id="summary" class="muted"></p></div><a class="button secondary" href="/wp-admin.html">Volver al administrador</a></div><div id="notice" class="notice" role="status">Cargando…</div><nav id="tabs" class="tabs card"></nav><section id="workspace"></section></main><script>
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search),pluginId=params.get('plugin'),locale=params.get('locale')||'es';let manifest,schema,activeType,editing=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),note=(m,e=false)=>{const x=$('#notice');x.textContent=m;x.className='notice'+(e?' error':'')},api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b===undefined?undefined:JSON.stringify(b)}),d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d};function tab(label,fn){const b=document.createElement('button');b.className='button secondary';b.textContent=label;b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.add('secondary'));b.classList.remove('secondary');fn()};$('#tabs').append(b);return b}
async function groups(type){return Promise.all(schema.taxonomies.filter(t=>t.plugin_id===manifest.id&&JSON.parse(t.object_types_json).includes(type.type_id)).map(async d=>({d,items:(await api(`/api/admin/plugins/${manifest.id}/taxonomies/${d.taxonomy_id}`)).items})))}function taxFields(all,selected=[]){const set=new Set(selected.map(x=>+x.id));return all.map(({d,items})=>`<fieldset class="field"><legend>${esc(d.label)}</legend>${items.map(x=>`<label><input type="checkbox" name="pluginTermIds" value="${x.id}" ${set.has(+x.id)?'checked':''}> ${esc(x.name)}</label>`).join('<br>')||'<span class="muted">Sin términos.</span>'}</fieldset>`).join('')}
async function content(type){activeType=type;const items=(await api(`/api/admin/content?contentType=${type.type_id}`)).items,area=$('#workspace');if(editing){const [meta,all]=await Promise.all([editing.id?api(`/api/admin/plugin-meta?scope=content&id=${editing.id}`).then(d=>Object.fromEntries(d.items.map(x=>[x.key,x.value]))):{},groups(type)]),defs=schema.meta.filter(x=>x.scope==='content'&&x.plugin_id===manifest.id);area.innerHTML=`<div class="grid"><form id="entry" class="card"><h2>${editing.id?'Editar':'Añadir'} ${esc(type.label)}</h2><div class="field"><label>Título *</label><input name="title" required value="${esc(editing.title||'')}"></div><div class="field"><label>Slug</label><input name="slug" value="${esc(editing.slug||'')}"></div><div class="field"><label>Extracto</label><textarea name="excerpt">${esc(editing.excerpt||'')}</textarea></div><div class="field"><label>Contenido</label><textarea name="body">${esc(editing.body||'')}</textarea></div><div class="field"><label>Estado</label><select name="status"><option value="draft">Borrador</option><option value="published">Publicado</option></select></div>${taxFields(all,editing.pluginTerms)}<button class="button">Guardar</button> <button type="button" id="cancel" class="button secondary">Cancelar</button></form><aside class="card"><h2>Metadatos</h2>${defs.map(d=>{const v=meta[d.meta_key];return `<div class="field"><label>${esc(d.meta_key.split('.').pop())}${d.required?' *':''}</label>${d.value_type==='json'?`<textarea form="entry" name="${esc(d.meta_key)}">${esc(v===undefined?'':JSON.stringify(v))}</textarea>`:`<input form="entry" name="${esc(d.meta_key)}" type="${d.value_type==='number'?'number':'text'}" value="${esc(v??'')}">`}</div>`}).join('')||'<p class="muted">Sin metadatos.</p>'}</aside></div>`;const f=$('#entry');f.status.value=editing.status||'draft';$('#cancel').onclick=()=>{editing=null;content(type)};f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f),raw=Object.fromEntries(fd),p={kind:'post',contentType:type.type_id,title:raw.title,slug:raw.slug,excerpt:raw.excerpt,body:raw.body,status:raw.status,pluginTermIds:fd.getAll('pluginTermIds').map(Number)};try{const r=editing.id?await api(`/api/admin/content/${editing.id}`,'PATCH',p):await api('/api/admin/content','POST',p),id=editing.id||r.id;for(const d of defs){let v=raw[d.meta_key];if(d.value_type==='number')v=Number(v);if(d.value_type==='json')v=v?JSON.parse(v):null;if(d.required&&(v===''||v===null||Number.isNaN(v)))throw Error(`Falta ${d.meta_key}`);if(v!==''&&v!==null&&!Number.isNaN(v))await api('/api/admin/plugin-meta','PUT',{scope:'content',id,key:d.meta_key,value:v})}note('Contenido, taxonomías y metadatos guardados.');editing=null;content(type)}catch(x){note(x.message,true)}};return}area.innerHTML=`<div class="head"><h2>${esc(type.label)}</h2><div><button id="new" class="button">Añadir</button> <button id="trash" class="button secondary">Papelera</button></div></div><div class="card"><table><thead><tr><th>Título</th><th>Estado</th><th>Taxonomías</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.status)}</td><td>${esc(x.pluginTerms.map(t=>t.name).join(', '))}</td><td><button data-edit="${x.id}" class="button secondary">Editar</button> <button data-trash="${x.id}" class="button danger">Papelera</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Sin elementos.</td></tr>'}</tbody></table></div>`;$('#new').onclick=()=>{editing={status:'draft',pluginTerms:[]};content(type)};$('#trash').onclick=()=>trash(type);area.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=items.find(x=>x.id===+b.dataset.edit);content(type)});area.querySelectorAll('[data-trash]').forEach(b=>b.onclick=async()=>{if(await CloudPressUI.confirm({title:'Enviar a papelera',message:'Podrás restaurarlo aquí.',confirmLabel:'Enviar',destructive:true})){await api(`/api/admin/content/${b.dataset.trash}`,'DELETE');note('Enviado a papelera.');content(type)}})}
async function trash(type){const items=(await api(`/api/admin/content?contentType=${type.type_id}&status=trash`)).items;$('#workspace').innerHTML=`<div class="head"><h2>Papelera · ${esc(type.label)}</h2><button id="back" class="button secondary">Volver</button></div><div class="card"><table><tbody>${items.map(x=>`<tr><td>${esc(x.title)}</td><td><button data-restore="${x.id}" class="button">Restaurar</button> <button data-purge="${x.id}" class="button danger">Eliminar definitivamente</button></td></tr>`).join('')||'<tr><td class="muted">Papelera vacía.</td></tr>'}</tbody></table></div>`;$('#back').onclick=()=>content(type);document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=async()=>{await api(`/api/admin/trash/${b.dataset.restore}`,'POST');note('Restaurado.');trash(type)});document.querySelectorAll('[data-purge]').forEach(b=>b.onclick=async()=>{if(await CloudPressUI.confirm({title:'Eliminar definitivamente',message:'No podrá recuperarse.',confirmLabel:'Eliminar',destructive:true})){await api(`/api/admin/trash/${b.dataset.purge}`,'DELETE');note('Eliminado.');trash(type)}})}
async function actions(){const a=manifest.actions||[];$('#workspace').innerHTML=`<div class="card"><h2>Acciones</h2>${a.map(x=>`<form class="act card" data-id="${x.id}"><h3>${esc(x.label)}</h3>${Object.entries(x.inputSchema?.properties||{}).map(([k,r])=>`<div class="field"><label>${esc(k)}</label><input name="${esc(k)}" type="${r.type==='number'?'number':'text'}"></div>`).join('')}<button class="button">Ejecutar</button><pre></pre></form>`).join('')}</div>`;document.querySelectorAll('.act').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const a1=a.find(x=>x.id===f.dataset.id),raw=Object.fromEntries(new FormData(f)),p={};for(const[k,r]of Object.entries(a1.inputSchema?.properties||{}))p[k]=r.type==='number'?Number(raw[k]):raw[k];try{const r=await api(`/api/admin/plugins/${manifest.id}/actions/${a1.id}`,'POST',p);f.querySelector('pre').textContent=JSON.stringify(r.result,null,2);note('Acción completada.')}catch(x){note(x.message,true)}})}
async function taxonomy(){const all=await Promise.all(schema.taxonomies.filter(x=>x.plugin_id===manifest.id).map(async d=>({d,items:(await api(`/api/admin/plugins/${manifest.id}/taxonomies/${d.taxonomy_id}`)).items})));const area=$('#workspace');area.innerHTML=all.map(({d,items})=>`<section class="card"><h2>${esc(d.label)}</h2><form data-tax="${d.taxonomy_id}" class="actions"><input name="name" placeholder="Nuevo término" required><button class="button">Añadir</button></form><ul>${items.map(x=>`<li>${esc(x.name)} <button data-tax="${d.taxonomy_id}" data-term="${x.id}" class="button danger">Eliminar</button></li>`).join('')||'<li class="muted">Sin términos.</li>'}</ul></section>`).join('');area.querySelectorAll('form[data-tax]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();await api(`/api/admin/plugins/${manifest.id}/taxonomies/${f.dataset.tax}`,'POST',{name:new FormData(f).get('name')});note('Término creado.');taxonomy()});area.querySelectorAll('[data-term]').forEach(b=>b.onclick=async()=>{if(await CloudPressUI.confirm({title:'Eliminar término',message:'Se desasignará del contenido.',confirmLabel:'Eliminar',destructive:true})){await api(`/api/admin/plugins/${manifest.id}/taxonomies/${b.dataset.tax}/${b.dataset.term}`,'DELETE');note('Término eliminado.');taxonomy()}})}
async function webhooks(){const w=manifest.webhooks||[];$('#workspace').innerHTML=`<div class="card"><h2>Webhooks</h2>${w.map(x=>`<article class="card"><h3>${esc(x.label)}</h3><code>/api/plugins/${esc(manifest.id)}${esc(x.path)}</code><p><button data-webhook="${x.id}" class="button">Rotar token</button></p><pre class="hidden"></pre></article>`).join('')||'<p class="muted">Sin webhooks.</p>'}</div>`;document.querySelectorAll('[data-webhook]').forEach(b=>b.onclick=async()=>{if(await CloudPressUI.confirm({title:'Rotar token',message:'El token anterior dejará de servir.',confirmLabel:'Rotar',destructive:true})){try{const r=await api(`/api/admin/plugins/${manifest.id}/webhooks/${b.dataset.webhook}`,'POST');const out=b.parentElement.parentElement.querySelector('pre');out.textContent=r.token;out.classList.remove('hidden');note('Token nuevo: cópialo ahora, no volverá a mostrarse.')}catch(x){note(x.message,true)}}})}
async function diagnostics(){const area=$('#workspace');area.innerHTML='<section class="card"><h2>Diagnóstico</h2><button id="run" class="button">Ejecutar diagnóstico</button><pre id="result"></pre></section>';$('#run').onclick=async()=>{try{$('#result').textContent=JSON.stringify((await api(`/api/admin/plugins/${manifest.id}/diagnostics`)).result,null,2);note('Diagnóstico completado.')}catch(x){note(x.message,true)}}}async function privacy(){const area=$('#workspace');area.innerHTML='<section class="card"><h2>Privacidad</h2><form id="privacy" class="actions"><input name="id" type="number" min="1" required placeholder="ID de usuario"><button class="button">Exportar datos</button><button type="button" id="erase" class="button danger">Borrar datos</button></form><pre id="result"></pre></section>';const f=$('#privacy'),id=()=>Number(new FormData(f).get('id'));f.onsubmit=async e=>{e.preventDefault();try{$('#result').textContent=JSON.stringify(await api(`/api/admin/plugins/${manifest.id}/privacy/${id()}`),null,2);note('Exportación generada.')}catch(x){note(x.message,true)}};$('#erase').onclick=async()=>{if(await CloudPressUI.confirm({title:'Borrar datos personales',message:'Se eliminarán sólo los datos de este plugin.',confirmLabel:'Borrar',destructive:true})){try{$('#result').textContent=JSON.stringify(await api(`/api/admin/plugins/${manifest.id}/privacy/${id()}`,'DELETE'),null,2);note('Datos borrados.')}catch(x){note(x.message,true)}}}}async function init(){try{const suffix=`?locale=${encodeURIComponent(locale)}`,[p,s]=await Promise.all([api('/api/admin/plugins'+suffix),api('/api/admin/plugin-schema'+suffix)]);manifest=p.available.find(x=>x.id===pluginId);schema=s;if(!manifest)throw Error('Plugin no disponible.');$('#title').textContent=manifest.name;$('#summary').textContent=manifest.description;const tabs=schema.contentTypes.filter(x=>x.plugin_id===manifest.id).map(x=>tab(x.label,()=>content(x)));tab('Acciones',actions);tab('Taxonomías',taxonomy);if(manifest.webhooks
