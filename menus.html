<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/admin-guard.js"></script><style>html:not(.authenticated) body{visibility:hidden}body{font:15px system-ui;background:#f0f0f1;margin:0;color:#1d2327}main{max-width:960px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #dcdcde;padding:20px;margin:16px 0}input,button{padding:8px;font:inherit;margin:4px}button{background:#2271b1;color:#fff;border:1px solid #2271b1}.secondary{background:#fff;color:#2271b1}li{padding:7px;border-bottom:1px solid #eee}.del{float:right;background:#fff;color:#b32d2e;border-color:#b32d2e}.edit{float:right;margin-right:5px}.muted{color:#646970}</style><main><h1>Menús</h1><p class="muted">Define la navegación pública del sitio.</p><div class="card"><form id="menu"><input id="label" required placeholder="Etiqueta"><input id="url" required placeholder="/ o https://"><input id="position" type="number" value="0" aria-label="Posición"><button id="save">Añadir enlace</button><button id="cancel" type="button" class="secondary" hidden>Cancelar</button></form><p id="message" class="muted" role="status"></p><ul id="items"></ul></div></main><script>
const api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo completar la acción');return d};let editing=null;
const reset=()=>{editing=null;menu.reset();position.value=0;save.textContent='Añadir enlace';cancel.hidden=true};
async function load(){try{const d=await api('/api/admin/menus');items.innerHTML='';d.items.forEach(x=>{const li=document.createElement('li');li.textContent=`${x.position} · ${x.label} → ${x.url}`;const e=document.createElement('button');e.textContent='Editar';e.className='edit';e.onclick=()=>{editing=x;label.value=x.label;url.value=x.url;position.value=x.position;save.textContent='Guardar cambios';cancel.hidden=false;label.focus()};const b=document.createElement('button');b.textContent='Eliminar';b.className='del';b.onclick=async()=>{if(!await CloudPressUI.confirm({title:'Eliminar enlace',message:`Se eliminará “${x.label}” del menú público.`,confirmLabel:'Eliminar enlace',destructive:true}))return;try{await api('/api/admin/menus?id='+x.id,'DELETE');CloudPressUI.toast('Enlace eliminado.');load()}catch(err){message.textContent=err.message}};li.append(b,e);items.append(li)})}catch(err){message.textContent=err.message}}
cancel.onclick=reset;menu.onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/menus'+(editing?'?id='+editing.id:''),editing?'PUT':'POST',{label:label.value,url:url.value,position:+position.value});CloudPressUI.toast(editing?'Cambios guardados.':'Enlace añadido.');reset();load()}catch(err){message.textContent=err.message}};load();
</script>
