<!doctype html>
<html lang="es">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escritorio ‹ CloudPress</title>
<style>
:root{--blue:#2271b1;--dark:#1d2327;--line:#dcdcde;--page:#f0f0f1}*{box-sizing:border-box}body{margin:0;background:var(--page);font:14px system-ui;color:#1d2327}.bar{height:32px;background:var(--dark);color:#f0f0f1;display:flex;align-items:center;gap:16px;padding:0 12px}.bar a,.bar button{background:0;border:0;color:inherit;font:inherit;text-decoration:none;padding:7px;cursor:pointer}.bar .right{margin-left:auto}.app{display:grid;grid-template-columns:205px 1fr;min-height:calc(100vh - 32px)}aside{background:var(--dark);color:#c3c4c7}.group{padding:10px 0}.label{padding:12px 14px 5px;font-size:11px;color:#8c8f94;font-weight:bold;text-transform:uppercase}.nav{display:block;width:100%;border:0;background:0;color:inherit;text-align:left;padding:9px 14px;font:inherit;cursor:pointer}.nav:hover,.nav.active{background:var(--blue);color:#fff}.nav.sub{padding-left:38px;font-size:13px}.head{background:#fff;border-bottom:1px solid var(--line);padding:20px 28px;display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:23px;font-weight:400}.head p{margin:5px 0 0;color:#646970}.primary{background:var(--blue);border:1px solid var(--blue);color:#fff;padding:8px 12px;font:inherit}.work{border:0;width:100%;height:calc(100vh - 139px);background:var(--page)}@media(max-width:720px){.app{grid-template-columns:1fr}aside{display:flex;overflow:auto}.group{display:flex;padding:0}.label,.sub{display:none!important}.nav{white-space:nowrap;width:auto}.work{height:calc(100vh - 170px)}}
</style>
<header class="bar"><a href="/wp-admin.html">◉ CloudPress</a><a href="/" target="_blank">Ver sitio</a><button id="add">＋ Añadir</button><span class="right"></span><button data-view="profile">Mi perfil</button><button id="logout">Salir</button></header>
<div class="app"><aside>
<div class="group"><button class="nav active" data-view="dashboard">▣ Escritorio</button></div>
<div class="label">Contenido</div>
<div class="group"><button class="nav" data-view="posts">✎ Entradas</button><button class="nav sub" data-view="newpost">Añadir nueva</button><button class="nav sub" data-view="taxonomies">Categorías y etiquetas</button><button class="nav" data-view="media">▧ Medios</button><button class="nav" data-view="pages">▤ Páginas</button><button class="nav sub" data-view="newpage">Añadir nueva</button><button class="nav" data-view="comments">▤ Comentarios</button><button class="nav sub" data-view="trash">Papelera</button></div>

</aside><main><div class="head"><div><h1 id="title">Escritorio</h1><p id="desc">Resumen y próximas acciones.</p></div><button id="action" class="primary">Añadir entrada</button></div><iframe id="work" class="work" title="Área de trabajo"></iframe></main></div>
<script>
const $=s=>document.querySelector(s),work=$('#work'),title=$('#title'),desc=$('#desc');
const map={dashboard:['/admin.html','overview','Resumen y próximas acciones.'],posts:['/admin.html','posts','Gestiona todas las entradas.'],newpost:['/admin.html','new-post','Crea una nueva entrada.'],taxonomies:['/taxonomias.html',null,'Gestiona categorías y etiquetas.'],media:['/admin.html','media','Biblioteca multimedia.'],pages:['/admin.html','pages','Gestiona las páginas.'],newpage:['/admin.html','new-page','Crea una nueva página.'],comments:['/comentarios.html',null,'Modera comentarios.'],trash:['/papelera.html',null,'Contenido enviado a papelera.'],appearance:['/apariencia.html',null,'Personaliza la apariencia.'],menus:['/menus.html',null,'Gestiona la navegación pública.'],users:['/admin.html','users','Administra usuarios.'],plugins:['/plugins.html',null,'Instala y administra extensiones verificadas.'],profile:['/perfil.html',null,'Actualiza tu perfil.'],tools:['/herramientas.html',null,'Operaciones de importación y exportación.'],import:['/importar.html',null,'Restaura un respaldo.'],export:['/exportar.html',null,'Exporta el contenido.'],revisions:['/revisiones.html',null,'Consulta y restaura versiones anteriores.'],settings:['/ajustes.html',null,'Configura el sitio.']};
function open(k){const r=map[k]||map.dashboard;title.textContent=document.querySelector(`[data-view="${k}"]`)?.textContent||'Escritorio';desc.textContent=r[2];document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===k));work.src=r[0]+`?shell=25`;work.onload=()=>{const d=work.contentDocument;if(!d)return;const st=d.createElement('style');st.textContent='.sidebar,.topbar{display:none!important}.shell{display:block!important}.content{padding:22px!important;max-width:1240px!important}.shell .main{display:block!important}main>p:first-child{display:none!important}';d.head.append(st);if(r[1]){const t=d.querySelector(r[1]==='new-post'?'#new-post':r[1]==='new-page'?'#new-page':`[data-view="${r[1]}"]`);t?.click()}}}
async function loadPluginNavigation(){try{const [schemaResponse,pluginsResponse]=await Promise.all([fetch('/api/admin/plugin-schema'),fetch('/api/admin/plugins')]),schema=await schemaResponse.json(),plugins=await pluginsResponse.json();if(!schemaResponse.ok||!pluginsResponse.ok)return;const group=document.createElement('div');group.className='group';const label=document.createElement('div');label.className='label';label.textContent='Plugins';group.append(label);const openPlugin=(button,pluginId,view,label)=>{title.textContent=label;desc.textContent='Administración del plugin.';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===button));work.src=`/plugin-admin.html?plugin=${encodeURIComponent(pluginId)}&view=${encodeURIComponent(view)}`};const ids=new Set([...schema.menus,...schema.contentTypes,...schema.actions,...schema.taxonomies,...schema.meta].map(item=>item.plugin_id));ids.forEach(pluginId=>{const manifest=plugins.available.find(item=>item.id===pluginId),menu=schema.menus.find(item=>item.plugin_id===pluginId),types=schema.contentTypes.filter(item=>item.plugin_id===pluginId),root=document.createElement('button');root.className='nav';root.textContent=menu?.label||manifest?.name||pluginId;root.onclick=()=>openPlugin(root,pluginId,menu?.view_id||types[0]?.type_id||'actions',root.textContent);group.append(root);types.forEach(type=>{const child=document.createElement('button');child.className='nav sub';child.textContent=type.label;child.onclick=()=>openPlugin(child,pluginId,type.type_id,type.label);group.append(child)})});if(ids.size)document.querySelector('aside').append(group)}catch{}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>open(b.dataset.view));$('#add').onclick=()=>open('newpost');$('#action').onclick=()=>open('newpost');$('#logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location='/login.html'};(async()=>{const r=await fetch('/api/me'),d=await r.json();if(!r.ok||d.user.role!=='admin')location='/login.html';else{await loadPluginNavigation();const requested=new URLSearchParams(location.search).get('view');open(map[requested]?requested:'dashboard')}})();
</script><script>(()=>{Object.assign(map,{roles:['/roles.html',null,'Configura roles y permisos.'],'content-types':['/content-types.html',null,'Crea y configura tipos de contenido.'],'advanced-fields':['/advanced-fields.html',null,'Define metadatos personalizados y sus reglas.']});const add=(view,label,marker)=>{if(document.querySelector(`[data-view="${view}"]`))return;const button=document.createElement('button');button.className='nav';button.dataset.view=view;button.dataset[marker]='1';button.textContent=label;button.onclick=()=>open(view);document.querySelector('aside .group:last-child').append(button)};add('roles','⚿ Roles','cloudpressRoles');add('content-types','⌗ Tipos de contenido','cloudpressContentTypes');add('advanced-fields','▤ Metadatos','cloudpressAdvancedFields')})()</script><script>(()=>{const baseOpen=open,contextualActions={dashboard:{label:'Añadir entrada',view:'newpost'},posts:{label:'Añadir entrada',view:'newpost'},pages:{label:'Añadir página',view:'newpage'}};open=key=>{baseOpen(key);const config=contextualActions[key],button=$('#action');button.hidden=!config;if(config){button.textContent=config.label;button.onclick=()=>open(config.view)}}})()</script><script src="/plugin-navigation.js?v=20260915-2"></script>
