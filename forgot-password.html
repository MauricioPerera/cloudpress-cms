<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar contraseña · CloudPress</title>
<style>body{font:16px system-ui;background:#f0f0f1;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:white;border:1px solid #dcdcde;padding:28px;width:min(400px,calc(100% - 32px))}input,button{box-sizing:border-box;width:100%;padding:10px;margin:8px 0;font:inherit}input{border:1px solid #8c8f94}button{background:#2271b1;border:1px solid #2271b1;color:#fff;cursor:pointer}#message{white-space:pre-wrap}</style>
<main class="card"><h1>Recuperar contraseña</h1><p>Escribe tu correo y te enviaremos un enlace de recuperación.</p><input id="email" type="email" placeholder="tu@correo.com" autocomplete="email"><button id="submit">Enviar enlace</button><p id="message"></p></main>
<script>const message=document.querySelector('#message');document.querySelector('#submit').onclick=async()=>{const r=await fetch('/api/forgot-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value})});const data=await r.json();if(!r.ok){message.style.color='#b32d2e';message.textContent=data.error||'No se pudo procesar la solicitud.';return}message.style.color='#146c43';message.textContent='Si existe una cuenta activa con ese correo, recibirás un enlace.'}</script>
