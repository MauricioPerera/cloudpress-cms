<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/admin-guard.js"></script><style>html:not(.authenticated) body{visibility:hidden}body{font:15px system-ui;background:#f0f0f1;color:#1d2327;margin:0}main{max-width:760px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #dcdcde;padding:20px}label{display:block;font-weight:600;margin:15px 0}input,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:9px;margin-top:6px;border:1px solid #8c8f94}textarea{min-height:90px}button{width:auto;background:#2271b1;color:#fff;border-color:#2271b1}.muted{color:#646970}</style><main><h1>Ajustes generales</h1><p class="muted">Configura los datos públicos del sitio. La apariencia visual se edita en Apariencia.</p><form id="settings" class="card"><label>Nombre del sitio<input id="site_name" required></label><label>Lema<input id="tagline"></label><label>Título de portada<input id="home_title"></label><label>Mensaje principal<textarea id="home_message"></textarea></label><button>Guardar ajustes</button></form><p id="message" class="muted" role="status"></p></main><script>const $=s=>document.querySelector(s),form=$('#settings'),siteName=$('#site_name'),tagline=$('#tagline'),homeTitle=$('#home_title'),homeMessage=$('#home_message'),message=$('#message');const api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d};async function load(){try{const s=(await api('/api/admin/settings')).settings;siteName.value=s.siteName||'';tagline.value=s.tagline||'';homeTitle.value=s.heroTitle||'';homeMessage.value=s.heroText||''}catch(e){message.textContent=e.message}}form.onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/settings','PATCH',{siteName:siteName.value,tagline:tagline.value,heroTitle:homeTitle.value,heroText:homeMessage.value});message.textContent='Ajustes guardados.'}catch(err){message.textContent=err.message}};load()</script>
