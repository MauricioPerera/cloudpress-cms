<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/admin-guard.js"></script><title>Campos · CloudPress</title><style>body{font:15px system-ui;margin:32px auto;max-width:850px;padding:0 18px;background:#f5f7fb;color:#172033}.card{background:#fff;border:1px solid #d9e0ec;border-radius:9px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:5px}input,select{font:inherit;padding:9px}button{padding:9px 13px;background:#1769aa;color:#fff;border:0;border-radius:4px}.item{border-top:1px solid #ddd;padding:12px 0}.muted{color:#5e6c80}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><main><p><a href="/content-types.html">← Tipos de contenido</a></p><h1 id="heading">Campos configurables</h1><p class="muted">Los campos de referencia sólo aceptan contenido existente del tipo indicado.</p><form id="form" class="card"><div class="grid"><label>Identificador <input name="fieldId" pattern="[a-z][a-z0-9-]{1,47}" required></label><label>Etiqueta <input name="label" maxlength="80" required></label><label>Tipo <select name="valueType"><option value="string">Texto</option><option value="number">Número</option><option value="boolean">Sí / no</option><option value="date">Fecha</option><option value="reference">Relación con contenido</option></select></label><label id="relation-wrap" hidden>Tipo relacionado <select name="relationType" id="relation"></select></label></div><label><input type="checkbox" name="required"> Obligatorio</label><p><button>Crear campo</button></p><p id="message"></p></form><section class="card"><h2>Campos definidos</h2><div id="list">Cargando…</div></section></main><script>(()=>{const type=new URLSearchParams(location.search).get('type'),$=s=>document.querySelector(s),form=$('#form'),list=$('#list'),message=$('#message'),relation=$('#relation'),api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:b?{'content-type':'application/json'}:{},body:b?JSON.stringify(b):undefined}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error');return d};if(!/^[a-z][a-z0-9-]{2,47}$/.test(type||'')){message.textContent='Tipo inválido.';form.hidden=true;throw Error('Tipo inválido')}$('#heading').textContent='Campos de '+type;const refresh=async()=>{const [fields,types]=await Promise.all([api('/api/admin/content-fields?type='+encodeURIComponent(type)),api('/api/admin/content-types')]);relation.replaceChildren(...types.types.map(t=>Object.assign(document.createElement('option'),{value:t.type_id,textContent:t.label+' ('+t.type_id+')'})));list.replaceChildren();if(!fields.fields.length){list.textContent='Aún no hay campos.';return}for(const f of fields.fields){const row=document.createElement('div');row.className='item';row.textContent=`${f.label} · ${f.field_id} · ${f.value_type}${f.required?' · obligatorio':''}${f.relation_type?' → '+f.relation_type:''}`;list.append(row)}};form.valueType.onchange=()=>$('#relation-wrap').hidden=form.valueType.value!=='reference';form.onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(form));d.typeId=type;d.required=form.required.checked;if(d.valueType!=='reference')delete d.relationType;await api('/api/admin/content-fields','POST',d);form.reset();$('#relation-wrap').hidden=true;message.textContent='Campo creado.';refresh()}catch(e){message.textContent=e.message}};refresh().catch(e=>message.textContent=e.message)})();</script>
