<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organización · CloudPress</title><style>body{font:15px system-ui;background:#f0f0f1;margin:0;color:#1d2327}main{max-width:960px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #dcdcde;padding:20px;margin:16px 0}input,select,button{padding:8px;font:inherit;margin:4px}button{background:#2271b1;color:#fff;border:1px solid #2271b1}li{padding:7px;border-bottom:1px solid #eee}.del{float:right;background:#fff;color:#b32d2e;border-color:#b32d2e}a{color:#2271b1}</style><main><p><a href="/admin.html">← Administración</a></p><h1>Organización editorial</h1><div class="card"><h2>Categorías y etiquetas</h2><form id="term"><select id="type"><option value="category">Categoría</option><option value="tag">Etiqueta</option></select><input id="name" required placeholder="Nombre"><button>Crear</button></form><ul id="terms"></ul></div><div class="card"><h2>Menú público</h2><form id="menu"><input id="label" required placeholder="Etiqueta"><input id="url" required placeholder="/ o https://"><input id="position" type="number" value="0"><button>Añadir enlace</button></form><ul id="menuitems"></ul></div></main><script>const api=async(p,m='GET',b)=>{let r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}),d=await r.json();if(!r.ok)throw Error(d.error);return d};async function load(){let t=await api('/api/admin/taxonomies'),m=await api('/api/admin/menus');terms.innerHTML='';t.terms.forEach(x=>{let li=document.createElement('li');li.textContent=`${x.type}: ${x.name} (${x.slug})`;let b=document.createElement('button');b.textContent='Eliminar';b.className='del';b.onclick=async()=>{await api('/api/admin/taxonomies?id='+x.id,'DELETE');load()};li.append(b);terms.append(li)});menuitems.innerHTML='';m.items.forEach(x=>{let li=document.createElement('li');li.textContent=`${x.position} · ${x.label} → ${x.url}`;let b=document.createElement('button');b.textContent='Eliminar';b.className='del';b.onclick=async()=>{await api('/api/admin/menus?id='+x.id,'DELETE');load()};li.append(b);menuitems.append(li)})}term.onsubmit=async e=>{e.preventDefault();await api('/api/admin/taxonomies','POST',{type:type.value,name:name.value});e.target.reset();load()};menu.onsubmit=async e=>{e.preventDefault();await api('/api/admin/menus','POST',{label:label.value,url:url.value,position:+position.value});e.target.reset();load()};load()</script>
