<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CloudPress</title><style>:root{--accent:#2271b1}body{margin:0;background:#f6f7f7;color:#1d2327;font:16px/1.6 system-ui}header{background:#fff;border-bottom:1px solid #dcdcde;padding:17px 22px}.head,main{max-width:820px;margin:auto}.head{display:flex;justify-content:space-between}.brand,a{color:var(--accent)}.brand{font-weight:750;font-size:22px}a{text-decoration:none}.article{background:#fff;border:1px solid #dcdcde;padding:34px;margin:38px 0}.article h1{line-height:1.15;font-size:42px}.article img{max-width:100%;height:auto}.meta,.terms{color:#646970}.terms span{background:#f0f0f1;padding:3px 7px;margin-right:5px}.comments{margin-top:34px;border-top:1px solid #dcdcde;padding-top:20px}.comment{border-bottom:1px solid #eee;padding:10px 0}input,button{font:inherit;padding:9px;box-sizing:border-box;width:100%;margin:6px 0}button{background:var(--accent);color:#fff;border:1px solid var(--accent)}.error{padding:32px;text-align:center}</style><header><div class="head"><a class="brand" href="/">CloudPress</a><a href="/">← Inicio</a></div></header><main id="app"><div class="error">Cargando…</div></main><script>const app=document.querySelector('#app'),slug=new URLSearchParams(location.search).get('slug'),kind=new URLSearchParams(location.search).get('kind')||'post';const esc=s=>String(s??'');async function comments(item,root){if(item.kind!=='post')return;const box=document.createElement('section');box.className='comments';box.innerHTML='<h2>Comentarios</h2>';const list=document.createElement('div'),form=document.createElement('form');form.innerHTML='<input name="author" required minlength="2" placeholder="Tu nombre"><input name="email" type="email" placeholder="Correo (opcional)"><input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none"><input name="body" required minlength="2" placeholder="Escribe un comentario"><button>Enviar comentario</button><small></small>';const render=async()=>{const data=await fetch('/api/comments?contentId='+item.id).then(r=>r.json());list.innerHTML='';if(!data.comments.length){list.textContent='Aún no hay comentarios aprobados.';return}data.comments.forEach(c=>{const el=document.createElement('div'),strong=document.createElement('strong');el.className='comment';strong.textContent=c.author_name;el.append(strong,document.createTextNode(': '+c.body));list.append(el)})};form.onsubmit=async e=>{e.preventDefault();const f=new FormData(form),note=form.querySelector('small');try{const r=await fetch('/api/comments',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contentId:item.id,author:f.get('author'),email:f.get('email'),website:f.get('website'),body:f.get('body')})}),d=await r.json();if(!r.ok)throw Error(d.error);form.reset();note.textContent=d.message}catch(e){note.textContent=e.message}};box.append(list,form);root.append(box);await render()}async function load(){try{if(!slug)throw Error('Falta el slug del contenido.');const r=await fetch('/api/content/'+encodeURIComponent(slug)+'?kind='+kind),d=await r.json();if(!r.ok)throw Error(d.error);const i=d.item;document.title=i.title+' · CloudPress';const article=document.createElement('article');article.className='article';const h1=document.createElement('h1');h1.textContent=i.title;const meta=document.createElement('p');meta.className='meta';meta.textContent='Publicado '+new Date(i.published_at).toLocaleDateString();const terms=document.createElement('p');terms.className='terms';i.terms.forEach(t=>{const tag=document.createElement('span');tag.textContent=t.name;terms.append(tag)});const body=document.createElement('div');body.innerHTML=i.body;article.append(h1,meta,terms,body);app.replaceChildren(article);await comments(i,article)}catch(e){app.innerHTML='<div class="error"></div>';app.firstChild.textContent=e.message}}load()</script>
