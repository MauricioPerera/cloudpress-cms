<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/admin-guard.js"></script><title>Apariencia · CloudPress</title><style>body{font:16px system-ui;background:#f5f7fb;color:#172033;margin:0}main{max-width:760px;margin:32px auto;padding:0 18px}.card{background:#fff;border:1px solid #d9e0ec;border-radius:9px;padding:22px;margin:16px 0}label{display:grid;gap:7px;margin:16px 0;font-weight:600}select,input,button{font:inherit;padding:10px}button{background:#1769aa;color:#fff;border:0;border-radius:5px}.preview{padding:24px;border-left:5px solid var(--accent);background:#172033;color:#fff}.preview.minimal{background:#fff;color:#172033;border:1px solid #d9e0ec}.preview.contrast{background:#000;border-color:#fff;color:#fff}</style><main><h1>Apariencia</h1><p>Elige un preajuste seguro del tema y su color de acento. No se admite CSS arbitrario.</p><form id="form" class="card"><label>Preajuste <select id="preset"><option value="classic">Clásico</option><option value="minimal">Minimal</option><option value="contrast">Alto contraste</option></select></label><label>Color de acento <input id="accent" type="color" required></label><button>Guardar apariencia</button><p id="message"></p></form><div id="preview" class="preview"><strong>Vista previa</strong><p>Cabecera, enlaces y tarjetas usarán este contrato de tema.</p></div></main><script>(()=>{const $=s=>document.querySelector(s),f=$('#form'),p=$('#preset'),a=$('#accent'),v=$('#preview'),m=$('#message'),api=async(path,method='GET',body)=>{const r=await fetch(path,{method,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d},paint=()=>{v.style.setProperty('--accent',a.value);v.className='preview '+p.value};(async()=>{try{const s=(await api('/api/admin/settings')).settings;p.value=s.themePreset||'classic';a.value=s.accentColor||'#2271b1';paint()}catch(e){m.textContent=e.message}})();p.onchange=a.oninput=paint;f.onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/settings','PATCH',{themePreset:p.value,accentColor:a.value});m.textContent='Apariencia guardada.'}catch(e){m.textContent=e.message}}})()</script>
