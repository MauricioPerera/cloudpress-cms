<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/admin-guard.js"></script><style>html:not(.authenticated) body{visibility:hidden}body{font:15px system-ui;background:#f0f0f1;margin:0;color:#1d2327}main{max-width:760px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #dcdcde;padding:20px;margin:16px 0}input,button{padding:8px;font:inherit;margin:4px}button{background:#2271b1;color:#fff;border:1px solid #2271b1}.preview{border-left:5px solid var(--accent,#2271b1);padding:18px;background:#f6f7f7}</style><main><h1>Apariencia</h1><p>Personaliza la identidad visual sin modificar los datos generales del sitio.</p><form id="appearance" class="card"><label>Color de acento <input id="accent_color" type="color" required></label><button>Guardar apariencia</button></form><div id="preview" class="preview"><strong>Vista previa</strong><p>Este color se usa como acento del tema público.</p></div><p id="message" role="status"></p></main><script>const $=s=>document.querySelector(s),form=$('#appearance'),accent=$('#accent_color'),preview=$('#preview'),message=$('#message');const api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d};const paint=()=>preview.style.setProperty('--accent',accent.value);async function load(){try{accent.value=(await api('/api/admin/settings')).settings.accentColor||'#2271b1';paint()}catch(e){message.textContent=e.message}}accent.oninput=paint;form.onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/settings','PATCH',{accentColor:accent.value});message.textContent='Apariencia guardada.'}catch(err){message.textContent=err.message}};load()</script>
