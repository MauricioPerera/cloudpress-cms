<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nueva contraseña · CloudPress</title>
<style>body{font:16px system-ui;background:#f0f0f1;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:white;border:1px solid #dcdcde;padding:28px;width:min(400px,calc(100% - 32px))}input,button{box-sizing:border-box;width:100%;padding:10px;margin:8px 0;font:inherit}input{border:1px solid #8c8f94}button{background:#2271b1;border:1px solid #2271b1;color:#fff;cursor:pointer}#message{color:#b32d2e;white-space:pre-wrap}</style>
<main class="card"><h1>Nueva contraseña</h1><p>Elige una contraseña de al menos 10 caracteres.</p><input id="password" type="password" minlength="10" placeholder="Nueva contraseña" autocomplete="new-password"><input id="confirm" type="password" minlength="10" placeholder="Confirmar contraseña" autocomplete="new-password"><button id="submit">Guardar contraseña</button><p id="message"></p></main>
<script>const token=new URLSearchParams(location.search).get('token'),message=document.querySelector('#message');document.querySelector('#submit').onclick=async()=>{if(!token)return message.textContent='El enlace es inválido.';if(password.value.length<10)return message.textContent='La contraseña debe tener al menos 10 caracteres.';if(password.value!==confirm.value)return message.textContent='Las contraseñas no coinciden.';const r=await fetch('/api/reset-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,password:password.value})});const data=await r.json();if(!r.ok)return message.textContent=data.error||'No se pudo cambiar la contraseña.';message.style.color='#146c43';message.textContent='Contraseña actualizada. Ahora puedes iniciar sesión.';setTimeout(()=>location.href='/',1200)}</script>
