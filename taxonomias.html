<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/admin-guard.js"></script><style>html:not(.authenticated) body{visibility:hidden}body{font:15px system-ui;background:#f0f0f1;margin:0;color:#1d2327}main{max-width:960px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #dcdcde;padding:20px;margin:16px 0}input,select,button{padding:8px;font:inherit;margin:4px}button{background:#2271b1;color:#fff;border:1px solid #2271b1}.secondary{background:#fff;color:#2271b1}li{padding:7px;border-bottom:1px solid #eee}.del{float:right;background:#fff;color:#b32d2e;border-color:#b32d2e}.edit{float:right;margin-right:5px}.muted{color:#646970}.notice{min-height:20px;color:#b32d2e}</style><main><h1>Categorías y etiquetas</h1><p class="muted">Organiza las entradas del sitio. Los menús se administran desde su propia pantalla.</p><div class="card"><form id="term"><select id="type"><option value="category">Categoría</option><option value="tag">Etiqueta</option></select><input id="term-name" required placeholder="Nombre"><button id="save">Crear</button><button id="cancel" type="button" class="secondary" hidden>Cancelar</button></form><p id="notice" class="notice" role="alert"></p><ul id="terms"></ul></div></main><script>
const $=s=>document.querySelector(s),form=$('#term'),typeField=$('#type'),nameField=$('#term-name'),save=$('#save'),cancel=$('#cancel'),notice=$('#notice'),terms=$('#terms');const api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo completar la acción');return d};let editing=null;
const reset=()=>{editing=null;form.reset();save.textContent='Crear';cancel.hidden=true;notice.textContent=''};
async function load(){try{const d=await api('/api/admin/taxonomies');terms.innerHTML='';d.terms.forEach(x=>{const li=document.createElement('li');li.textContent=`${x.type==='category'?'Categoría':'Etiqueta'}: ${x.name} (${x.slug})`;const e=document.createElement('button');e.textContent='Editar';e.className='edit';e.onclick=()=>{editing=x;typeField.value=x.type;nameField.value=x.name;save.textContent='Guardar cambios';cancel.hidden=false;notice.textContent='';nameField.focus()};const b=document.createElement('button');b.textContent='Eliminar';b.className='del';b.onclick=async()=>{if(!await CloudPressUI.confirm({title:'Eliminar término',message:`Se eliminará “${x.name}”. Las entradas no se eliminarán.`,confirmLabel:'Eliminar término',destructive:true}))return;try{await api('/api/admin/taxonomies?id='+x.id,'DELETE');CloudPressUI.toast('Término eliminado.');load()}catch(err){notice.textContent=err.message}};li.append(b,e);terms.append(li)})}catch(err){notice.textContent=err.message}}
cancel.onclick=reset;form.onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/taxonomies'+(editing?'?id='+editing.id:''),editing?'PUT':'POST',{type:typeField.value,name:nameField.value});CloudPressUI.toast(editing?'Cambios guardados.':'Término creado.');reset();load()}catch(err){notice.textContent=err.message}};load();
</script>
