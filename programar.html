<!doctype html><meta charset="utf-8"><title>Programar · CloudPress</title><main><a href="/admin.html">← Administración</a><h1>Publicación programada</h1><form id="f"><input name="title" required placeholder="Título"><input name="publishedAt" type="datetime-local" required><textarea name="body" placeholder="Contenido"></textarea><button>Programar entrada</button></form><p id="m"></p><section id="list"></section><script>const api=async(p,m='GET',b)=>{let r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}),d=await r.json();if(!r.ok)throw Error(d.error);return d};async function load(){let d=await api('/api/admin/content?kind=post');list.innerHTML='';d.items.filter(x=>x.status==='published'&&new Date(x.published_at)>new Date).forEach(x=>{let p=document.createElement('p');p.textContent=`Programada: ${x.title} · ${new Date(x.published_at).toLocaleString()}`;list.append(p)})}f.onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(f));try{await api('/api/admin/content','POST',{kind:'post',title:v.title,body:v.body,status:'published',publishedAt:new Date(v.publishedAt).toISOString()});m.textContent='Entrada programada.';f.reset();load()}catch(e){m.textContent=e.message}};load()</script>
