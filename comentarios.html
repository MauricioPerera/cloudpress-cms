<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comentarios · CloudPress</title><style>body{font:15px system-ui;background:#f0f0f1;margin:0;color:#1d2327}main{max-width:1060px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #dcdcde;padding:20px;margin:16px 0}.toolbar{display:flex;gap:8px;align-items:center}button,select{font:inherit;padding:8px}button{background:#2271b1;color:#fff;border:1px solid #2271b1}.delete{background:#fff;color:#b32d2e;border-color:#b32d2e}.muted{color:#646970}.comment{border-bottom:1px solid #dcdcde;padding:16px 0}.comment:last-child{border:0}p{white-space:pre-wrap}a{color:#2271b1;text-decoration:none}</style><main><p><a href="/admin.html">← Administración</a></p><h1>Comentarios</h1><div class="toolbar"><label>Mostrar <select id="filter"><option value="pending">Pendientes</option><option value="approved">Aprobados</option><option value="">Todos</option></select></label><button id="reload">Actualizar</button></div><div id="message" class="muted" role="status">Cargando…</div><section id="comments"></section></main><script>
const $=s=>document.querySelector(s),message=$('#message'),comments=$('#comments'),filter=$('#filter');const api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}),d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw Error(d.error||'Error');return d};
function addText(el,tag,value){const n=document.createElement(tag);n.textContent=value;el.append(n);return n}
async function load(){try{const data=await api('/api/admin/comments'+(filter.value?'?status='+filter.value:''));comments.innerHTML='';message.textContent=`${data.comments.length} comentario(s)`;if(!data.comments.length){comments.textContent='No hay comentarios en este estado.';return}data.comments.forEach(c=>{const item=document.createElement('article');item.className='card comment';addText(item,'strong',c.author_name);addText(item,'span',` · ${c.content_title}`);const meta=addText(item,'div',`${c.status==='pending'?'Pendiente':'Aprobado'} · ${new Date(c.created_at+'Z').toLocaleString()}`);meta.className='muted';addText(item,'p',c.body);const actions=document.createElement('div');actions.className='toolbar';if(c.status==='pending'){const approve=document.createElement('button');approve.textContent='Aprobar';approve.onclick=async()=>{try{await api('/api/admin/comments/'+c.id,'PATCH',{status:'approved'});CloudPressUI.toast('Comentario aprobado.');load()}catch(err){message.textContent=err.message}};actions.append(approve)}const del=document.createElement('button');del.className='delete';del.textContent='Eliminar';del.onclick=async()=>{if(!await CloudPressUI.confirm({title:'Eliminar comentario',message:'Este comentario se eliminará definitivamente.',confirmLabel:'Eliminar comentario',destructive:true}))return;try{await api('/api/admin/comments/'+c.id,'DELETE');CloudPressUI.toast('Comentario eliminado.');load()}catch(err){message.textContent=err.message}};actions.append(del);item.append(actions);comments.append(item)})}catch(e){message.textContent=e.message}}
filter.onchange=load;$('#reload').onclick=load;load();
</script>
