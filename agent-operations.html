<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/admin-guard.js"></script><title>Operaciones de agentes · CloudPress</title><style>html:not(.authenticated)body{visibility:hidden}body{margin:0;background:#f0f0f1;color:#1d2327;font:14px system-ui}main{max-width:1100px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}.head h1{margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #dcdcde;border-radius:6px;padding:20px;margin:18px 0}.field{display:grid;gap:6px;margin:12px 0;font-weight:600}input,textarea,select{box-sizing:border-box;width:100%;padding:8px;border:1px solid #8c8f94;font:inherit}textarea{min-height:84px}.tools{display:grid;gap:7px;padding:10px;border:1px solid #dcdcde}.button{border:1px solid #2271b1;background:#2271b1;color:#fff;padding:8px 13px;font:inherit;font-weight:600;cursor:pointer}.secondary,.danger{background:#fff;color:#2271b1}.danger{border-color:#b32d2e;color:#b32d2e}.notice{padding:11px;background:#fff;border-left:4px solid #2271b1}.error{border-color:#d63638}.muted{color:#646970}.badge{background:#f0f0f1;border-radius:99px;padding:3px 8px}.task{border-top:1px solid #dcdcde;padding:14px 0}.trace{max-height:250px;overflow:auto;background:#1d2327;color:#fff;padding:12px;white-space:pre-wrap}@media(max-width:720px){main{padding:16px}.grid{grid-template-columns:1fr}}</style><main><header class="head"><div><h1>Operaciones de agentes</h1><p class="muted">Perfiles limitados, tareas trazables y pasos verificables.</p></div><button id="refresh" class="button secondary">Actualizar</button></header><div id="notice" class="notice" role="status">Cargando…</div><div class="grid"><section class="card"><h2>Crear perfil</h2><form id="profile"><label class="field">Identificador<input name="id" pattern="[a-z][a-z0-9-]{2,47}" required></label><label class="field">Nombre<input name="label" maxlength="80" required></label><label class="field">Propósito<textarea name="purpose" maxlength="500" required></textarea></label><div class="grid"><label class="field">Clasificación máxima<select name="classification"><option value="public">Público</option><option value="internal" selected>Interno</option><option value="restricted">Restringido</option></select></label><label class="field">Tareas activas<input name="runs" type="number" min="1" max="20" value="1"></label></div><label class="field">Pasos máximos<input name="steps" type="number" min="1" max="200" value="25"></label><fieldset class="tools"><legend>Herramientas permitidas</legend><label><input type="checkbox" name="tool" value="cloudpress_read_admin_state|read"> Leer estado</label><label><input type="checkbox" name="tool" value="cloudpress_create_draft|reversible"> Crear borrador</label><label><input type="checkbox" name="tool" value="cloudpress_update_content|reversible"> Actualizar contenido</label><label><input type="checkbox" name="tool" value="cloudpress_trash_content|reversible"> Enviar a papelera</label><label><input type="checkbox" name="sensitive"> Permitir acciones sensibles con A2F</label><label><input type="checkbox" name="tool" value="cloudpress_sensitive_action|sensitive"> Solicitar acción irreversible</label></fieldset><p><button class="button">Crear perfil</button></p></form></section><section class="card"><h2>Crear tarea</h2><form id="task"><label class="field">Perfil<select name="profileId" required></select></label><label class="field">Objetivo<textarea name="objective" maxlength="2000" required></textarea></label><label class="field">Clasificación de datos<select name="classification"><option value="public">Público</option><option value="internal" selected>Interno</option><option value="restricted">Restringido</option></select></label><fieldset id="tools" class="tools"><legend>Pasos</legend><span class="muted">Selecciona un perfil.</span></fieldset><p class="muted">Cada paso debe verificarse. Los sensibles requieren una aprobación A2F aceptada.</p><button class="button">Crear tarea</button></form></section></div><section class="card"><h2>Perfiles</h2><div id="profiles"></div></section><section class="card"><h2>Tareas</h2><div id="tasks"></div></section></main><script>
const $=s=>document.querySelector(s),E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b===undefined?undefined:JSON.stringify(b)}),d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d};let S={profiles:[],tasks:[]};const note=(x,b)=>{let n=$('#notice');n.textContent=x;n.className='notice'+(b?' error':'')};function tools(){let p=S.profiles.find(x=>x.id===$('#task').profileId.value),a=$('#tools');a.innerHTML=p?'<legend>Pasos</legend>'+p.tools.map(t=>`<label><input name="step" type="checkbox" value="${E(t.name)}|${E(t.risk)}"> ${E(t.name)} (${E(t.risk)})</label>`).join(''):'<legend>Pasos</legend><span class="muted">Selecciona un perfil.</span>'}function render(){let s=$('#task').profileId,o=s.value;s.innerHTML='<option value="">Selecciona…</option>'+S.profiles.filter(p=>p.status==='active').map(p=>`<option value="${E(p.id)}">${E(p.label)}</option>`).join('');s.value=o;$('#profiles').innerHTML=S.profiles.map(p=>`<article class="task"><strong>${E(p.label)}</strong> <span class="badge">${E(p.status)}</span><br><span class="muted">${E(p.purpose)} · máximo ${E(p.dataPolicy.maximumClassification)}</span><br><small>${p.tools.map(t=>E(t.name)+' · '+E(t.risk)).join(' · ')||'Sin herramientas'}</small></article>`).join('')||'<p class="muted">Aún no hay perfiles.</p>';$('#tasks').innerHTML=S.tasks.map(t=>`<article class="task"><strong>${E(t.objective)}</strong> <span class="badge">${E(t.state)}</span><br><span class="muted">${E(t.profile_id)} · ${E(t.trace_id)}</span><p><button class="button secondary" data-detail="${E(t.id)}">Detalle</button>${t.state==='queued'?` <button class="button" data-state="${E(t.id)}|running">Iniciar</button>`:''}${t.state==='running'?` <button class="button secondary" data-state="${E(t.id)}|paused">Pausar</button>`:''}${['paused','waiting_approval'].includes(t.state)?` <button class="button" data-state="${E(t.id)}|queued">Reanudar</button>`:''}${t.state==='failed'?` <button class="button" data-retry="${E(t.id)}">Reintentar</button>`:''}${!['completed','cancelled'].includes(t.state)?` <button class="button danger" data-state="${E(t.id)}|cancelled">Cancelar</button>`:''}</p><div id="detail-${E(t.id)}"></div></article>`).join('')||'<p class="muted">Aún no hay tareas.</p>';document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>act({action:'retry_task',taskId:b.dataset.retry}));document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>state(b.dataset.state));tools()}async function act(b){try{await api('/api/admin/agent-tasks','POST',b);note('Operación registrada.');refresh()}catch(e){note(e.message,true)}}async function state(v){let[taskId,state]=v.split('|');if(state==='cancelled'&&!await CloudPressUI.confirm({title:'Cancelar tarea',message:'Se conservará la traza.',confirmLabel:'Cancelar',destructive:true}))return;act({action:'transition_task',taskId,state})}async function detail(id){try{let t=(await api('/api/admin/agent-tasks?taskId='+id)).task,r=t.runs[0];$('#detail-'+id).innerHTML=`<p>Ejecución ${r.attempt}: ${E(r.state)} · ${r.steps_used}/${r.step_limit}</p>${r.steps.map(x=>`<p>#${x.ordinal} ${E(x.tool_name)} · ${E(x.state)}${x.approval_request_id?' · A2F vinculada':''}</p>`).join('')}<pre class="trace">${E(t.trace.map(e=>e.created_at+' · '+e.event+' · '+JSON.stringify(e.details)).join('\n'))}</pre>`}catch(e){note(e.message,true)}}async function refresh(){try{S=await api('/api/admin/agent-tasks');render();note('Consola operativa actualizada.')}catch(e){note(e.message,true)}}$('#profile').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget),ts=f.getAll('tool').map(x=>{let[n,r]=x.split('|');return{name:n,risk:r}});act({action:'create_profile',id:f.get('id'),label:f.get('label'),purpose:f.get('purpose'),maxActiveRuns:+f.get('runs'),maxStepsPerRun:+f.get('steps'),dataPolicy:{maximumClassification:f.get('classification'),allowSensitive:f.has('sensitive')},tools:ts})};$('#task').profileId.onchange=tools;$('#task').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget),plan=f.getAll('step').map(x=>{let[tool,risk]=x.split('|');return{tool,risk,preconditions:risk==='sensitive'?{approvalOperation:'purge_content'}:{authorized:true},expected:{verified:true}});act({action:'create_task',profileId:f.get('profileId'),objective:f.get('objective'),plan,context:{classification:f.get('classification')},expected:{verified:true}})};$('#refresh').onclick=refresh;refresh();
</script></html>
