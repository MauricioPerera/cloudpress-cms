<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/admin-guard.js"></script><title>Operaciones de agentes · CloudPress</title>
<style>html:not(.authenticated)body{visibility:hidden}body{margin:0;background:#f0f0f1;color:#1d2327;font:14px system-ui}main{max-width:1100px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}.head h1{margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #dcdcde;border-radius:6px;padding:20px;margin:18px 0}.field{display:grid;gap:6px;margin:12px 0;font-weight:600}input,textarea,select{box-sizing:border-box;width:100%;padding:8px;border:1px solid #8c8f94;font:inherit}textarea{min-height:84px}.tools{display:grid;gap:7px;padding:10px;border:1px solid #dcdcde}.button{border:1px solid #2271b1;background:#2271b1;color:#fff;padding:8px 13px;font:inherit;font-weight:600;cursor:pointer}.secondary,.danger{background:#fff;color:#2271b1}.danger{border-color:#b32d2e;color:#b32d2e}.notice{padding:11px;background:#fff;border-left:4px solid #2271b1}.error{border-color:#d63638}.muted{color:#646970}.badge{background:#f0f0f1;border-radius:99px;padding:3px 8px}.task{border-top:1px solid #dcdcde;padding:14px 0}.trace{max-height:250px;overflow:auto;background:#1d2327;color:#fff;padding:12px;white-space:pre-wrap}@media(max-width:720px){main{padding:16px}.grid{grid-template-columns:1fr}}</style>
<main><header class="head"><div><h1>Operaciones de agentes</h1><p class="muted">Perfiles limitados, tareas trazables y pasos verificables.</p></div><button id="refresh" class="button secondary">Actualizar</button></header><div id="notice" class="notice" role="status">Cargando…</div><div class="grid"><section class="card"><h2>Crear perfil</h2><form id="profile"><label class="field">Identificador<input name="id" pattern="[a-z][a-z0-9-]{2,47}" required></label><label class="field">Nombre<input name="label" maxlength="80" required></label><label class="field">Propósito<textarea name="purpose" maxlength="500" required></textarea></label><div class="grid"><label class="field">Clasificación máxima<select name="classification"><option value="public">Público</option><option value="internal" selected>Interno</option><option value="restricted">Restringido</option></select></label><label class="field">Tareas activas<input name="runs" type="number" min="1" max="20" value="1"></label></div><label class="field">Pasos máximos<input name="steps" type="number" min="1" max="200" value="25"></label><fieldset id="profile-tools" class="tools"><legend>Herramientas permitidas</legend></fieldset><p><button class="button">Crear perfil</button></p></form></section><section class="card"><h2>Crear tarea</h2><form id="task"><label class="field">Perfil<select name="profileId" required></select></label><label class="field">Objetivo<textarea name="objective" maxlength="2000" required></textarea></label><label class="field">Clasificación de datos<select name="classification"><option value="public">Público</option><option value="internal" selected>Interno</option><option value="restricted">Restringido</option></select></label><fieldset id="task-tools" class="tools"><legend>Pasos</legend><span class="muted">Selecciona un perfil.</span></fieldset><p class="muted">Cada paso debe verificarse. Los sensibles requieren una aprobación A2F aceptada.</p><button class="button">Crear tarea</button></form></section></div><section class="card"><h2>Perfiles</h2><div id="profiles"></div></section><section class="card"><h2>Tareas</h2><div id="tasks"></div></section></main>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const available=[['cloudpress_read_admin_state','read','Leer estado'],['cloudpress_create_draft','reversible','Crear borrador'],['cloudpress_update_content','reversible','Actualizar contenido'],['cloudpress_trash_content','reversible','Enviar a papelera'],['cloudpress_restore_content','reversible','Restaurar contenido'],['cloudpress_set_user_active','reversible','Activar o desactivar usuario'],['cloudpress_manage_navigation','reversible','Gestionar navegación'],['cloudpress_manage_terms','reversible','Gestionar términos'],['cloudpress_manage_meta','reversible','Gestionar metadatos'],['cloudpress_install_plugin','reversible','Instalar plugin validado'],['cloudpress_set_plugin_state','reversible','Activar o desactivar plugin'],['cloudpress_upload_media','reversible','Subir imagen'],['cloudpress_update_media_meta','reversible','Actualizar metadatos de imagen'],['cloudpress_sensitive_action','sensitive','Solicitar acción irreversible']];let state={profiles:[],tasks:[]};
const note=(m,error=false)=>{const n=$('#notice');n.textContent=m;n.className='notice'+(error?' error':'')};
const api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b===undefined?undefined:JSON.stringify(b)}),d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d};
function profileTools(){const box=$('#profile-tools');box.innerHTML='<legend>Herramientas permitidas</legend>'+available.map(([name,risk,label])=>`<label><input type="checkbox" name="tool" value="${name}|${risk}"> ${esc(label)}${risk==='sensitive'?' (A2F)':''}</label>`).join('')+'<label><input type="checkbox" name="sensitive"> Permitir acciones sensibles con A2F</label>'}
function taskTools(){const profile=state.profiles.find(x=>x.id===$('#task').profileId.value),box=$('#task-tools');box.innerHTML=profile?'<legend>Pasos</legend>'+profile.tools.map(t=>`<label><input name="step" type="checkbox" value="${esc(t.name)}|${esc(t.risk)}"> ${esc(t.name)} (${esc(t.risk)})</label>`).join(''):'<legend>Pasos</legend><span class="muted">Selecciona un perfil.</span>'}
function profileButtons(p){if(p.status==='active')return `<button class="button secondary" data-profile="${esc(p.id)}|paused">Pausar</button> <button class="button danger" data-profile="${esc(p.id)}|revoked">Revocar</button>`;if(p.status==='paused')return `<button class="button" data-profile="${esc(p.id)}|active">Activar</button> <button class="button danger" data-profile="${esc(p.id)}|revoked">Revocar</button>`;return '<span class="muted">Revocado permanentemente.</span>'}
function taskButtons(t){let a=[`<button class="button secondary" data-detail="${esc(t.id)}">Detalle</button>`];if(t.state==='queued')a.push(`<button class="button" data-state="${esc(t.id)}|running">Iniciar</button>`);if(t.state==='running')a.push(`<button class="button secondary" data-state="${esc(t.id)}|paused">Pausar</button>`);if(t.state==='paused')a.push(`<button class="button" data-state="${esc(t.id)}|queued">Reanudar</button>`);if(t.state==='waiting_approval')a.push('<span class="muted">Esperando aprobación A2F.</span>');if(t.state==='failed')a.push(`<button class="button" data-retry="${esc(t.id)}">Reintentar</button>`);if(!['completed','cancelled'].includes(t.state))a.push(`<button class="button danger" data-state="${esc(t.id)}|cancelled">Cancelar</button>`);return a.join(' ')}
function render(){const select=$('#task').profileId,current=select.value;select.innerHTML='<option value="">Selecciona…</option>'+state.profiles.filter(p=>p.status==='active').map(p=>`<option value="${esc(p.id)}">${esc(p.label)}</option>`).join('');select.value=current;$('#profiles').innerHTML=state.profiles.map(p=>`<article class="task"><strong>${esc(p.label)}</strong> <span class="badge">${esc(p.status)}</span><br><span class="muted">${esc(p.purpose)} · máximo ${esc(p.dataPolicy.maximumClassification)}</span><br><small>${p.tools.map(t=>esc(t.name)+' · '+esc(t.risk)).join(' · ')||'Sin herramientas'}</small><p>${profileButtons(p)}</p></article>`).join('')||'<p class="muted">Aún no hay perfiles.</p>';$('#tasks').innerHTML=state.tasks.map(t=>`<article class="task"><strong>${esc(t.objective)}</strong> <span class="badge">${esc(t.state)}</span><br><span class="muted">${esc(t.profile_id)} · ${esc(t.trace_id)}</span><p>${taskButtons(t)}</p><div id="detail-${esc(t.id)}"></div></article>`).join('')||'<p class="muted">Aún no hay tareas.</p>';bind();taskTools()}
async function act(body){try{await api('/api/admin/agent-tasks','POST',body);note('Operación registrada.');await refresh()}catch(e){note(e.message,true)}}
async function detail(id){try{const t=(await api(`/api/admin/agent-tasks?taskId=${encodeURIComponent(id)}`)).task,r=t.runs[0];$(`#detail-${id}`).innerHTML=`<p>Ejecución ${r.attempt}: ${esc(r.state)} · ${r.steps_used}/${r.step_limit}</p>${r.steps.map(x=>`<p>#${x.ordinal} ${esc(x.tool_name)} · ${esc(x.state)}${x.approval_request_id?' · A2F vinculada':''}</p>`).join('')}<pre class="trace">${esc(t.trace.map(e=>e.created_at+' · '+e.event+' · '+JSON.stringify(e.details)).join('\n'))}</pre>`}catch(e){note(e.message,true)}}
function bind(){document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>act({action:'retry_task',taskId:b.dataset.retry}));document.querySelectorAll('[data-state]').forEach(b=>b.onclick=async()=>{const[id,next]=b.dataset.state.split('|');if(next==='cancelled'&&!await CloudPressUI.confirm({title:'Cancelar tarea',message:'Se conservará la traza.',confirmLabel:'Cancelar',destructive:true}))return;act({action:'transition_task',taskId:id,state:next})});document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=async()=>{const[id,status]=b.dataset.profile.split('|');if(status==='revoked'&&!await CloudPressUI.confirm({title:'Revocar perfil',message:'Se invalidarán sus capacidades activas y no podrá reactivarse.',confirmLabel:'Revocar',destructive:true}))return;act({action:'set_profile_status',profileId:id,status})})}
async function refresh(){try{state=await api('/api/admin/agent-tasks');render();note('Consola operativa actualizada.')}catch(e){note(e.message,true)}}
$('#profile').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),tools=f.getAll('tool').map(x=>{const[name,risk]=x.split('|');return{name,risk}});act({action:'create_profile',id:f.get('id'),label:f.get('label'),purpose:f.get('purpose'),maxActiveRuns:+f.get('runs'),maxStepsPerRun:+f.get('steps'),dataPolicy:{maximumClassification:f.get('classification'),allowSensitive:f.has('sensitive')},tools})};$('#task').profileId.onchange=taskTools;$('#task').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),plan=f.getAll('step').map(x=>{const[tool,risk]=x.split('|');return{tool,risk,preconditions:risk==='sensitive'?{approvalOperation:'purge_content'}:{authorized:true},expected:{verified:true}}});act({action:'create_task',profileId:f.get('profileId'),objective:f.get('objective'),plan,context:{classification:f.get('classification')},expected:{verified:true}})};$('#refresh').onclick=refresh;profileTools();refresh();
</script></html>
