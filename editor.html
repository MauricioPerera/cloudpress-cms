<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escritorio editorial · CloudPress</title><style>body{font:15px system-ui;background:#f0f0f1;margin:0;color:#1d2327}main{max-width:1060px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #dcdcde;padding:20px;margin:16px 0}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,input,textarea{font:inherit;padding:8px}button{background:#2271b1;color:#fff;border:1px solid #2271b1}.secondary{background:#fff;color:#2271b1}.delete{background:#fff;color:#b32d2e;border-color:#b32d2e}.muted{color:#646970}.item{border-bottom:1px solid #dcdcde;padding:16px 0}.item:last-child{border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}input,textarea,select{box-sizing:border-box;width:100%;border:1px solid #8c8f94}textarea{min-height:180px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><main><div class="toolbar"><h1 style="margin-right:auto">Escritorio editorial</h1><span id="user" class="muted"></span><button id="profile-btn" class="secondary">Perfil</button><button id="logout" class="secondary">Cerrar sesión</button></div><div class="toolbar"><label>Mostrar <select id="view"><option value="content">Mi contenido</option><option value="trash">Mi papelera</option></select></label><label>Tipo <select id="kind"><option value="">Entradas y páginas</option><option value="post">Entradas</option><option value="page">Páginas</option></select></label><button id="create-btn">Crear contenido</button><button id="reload" class="secondary">Actualizar</button></div><div id="message" class="muted">Cargando…</div><section id="items"></section></main><script>const $=s=>document.querySelector(s);const api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}),d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw Error(d.error||'Error');return d};const add=(p,t,v,c)=>{const n=document.createElement(t);n.textContent=v;if(c)n.className=c;p.append(n);return n};function form(item={kind:'post',status:'draft'}){items.innerHTML='';const f=document.createElement('form');f.className='card grid';f.innerHTML='<label>Título<input name="title" required maxlength="180"></label><label>Tipo<select name="kind"><option value="post">Entrada</option><option value="page">Página</option></select></label><label class="full">Slug<input name="slug" maxlength="96"></label><label class="full">Extracto<textarea name="excerpt" maxlength="500" style="min-height:80px"></textarea></label><label class="full">Contenido<textarea name="body" maxlength="50000"></textarea></label><label>Estado<select name="status"><option value="draft">Borrador</option><option value="published">Publicado</option></select></label><div class="toolbar full"><button>Guardar</button><button type="button" class="secondary" id="cancel">Cancelar</button></div>';for(const k of ['title','slug','excerpt','body','kind','status'])f.elements[k].value=item[k]||'';f.onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(f));try{if(item.id)await api('/api/editor/content/'+item.id,'PATCH',p);else await api('/api/editor/content','POST',p);await load()}catch(err){message.textContent=err.message}};items.append(f);$('#cancel').onclick=load}async function load(){try{const trash=view.value==='trash';$('#create-btn').disabled=trash;items.innerHTML='';message.textContent='Cargando…';const d=await api('/api/editor/content?'+(trash?'status=trash&':'')+(kind.value?'kind='+kind.value:''));message.textContent=d.items.length?`${d.items.length} elemento(s).`:trash?'Tu papelera está vacía.':'Aún no has creado contenido.';d.items.forEach(i=>{const el=document.createElement('article');el.className='card item';add(el,'strong',i.title);add(el,'div',`${i.kind==='page'?'Página':'Entrada'} · ${i.status==='published'?'Publicado':i.status==='trash'?'Papelera':'Borrador'}`,'muted');const actions=document.createElement('div');actions.className='toolbar';if(trash){const restore=document.createElement('button');restore.textContent='Restaurar';restore.onclick=async()=>{await api('/api/editor/trash/'+i.id,'POST');load()};const purge=document.createElement('button');purge.className='delete';purge.textContent='Eliminar definitivamente';purge.onclick=async()=>{if(confirm('¿Eliminar definitivamente?')){await api('/api/editor/trash/'+i.id,'DELETE');load()}};actions.append(restore,purge)}else{const edit=document.createElement('button');edit.className='secondary';edit.textContent='Editar';edit.onclick=()=>form(i);const del=document.createElement('button');del.className='delete';del.textContent='Enviar a papelera';del.onclick=async()=>{if(confirm('¿Enviar a papelera?')){await api('/api/editor/content/'+i.id,'DELETE');load()}};actions.append(edit,del)}el.append(actions);items.append(el)})}catch(e){message.textContent=e.message}}$('#create-btn').onclick=()=>form();view.onchange=load;kind.onchange=load;reload.onclick=load;$('#profile-btn').onclick=()=>location.href='/perfil.html';logout.onclick=async()=>{await api('/api/logout','POST');location.href='/'};(async()=>{try{const m=await api('/api/me');if(m.user.role!=='author')throw Error('Esta cuenta no tiene rol Autor.');user.textContent=m.user.username+' · Autor';load()}catch(e){message.textContent=e.message}})()</script>
