u.get('q')||'';f.onsubmit=e=>{e.preventDefault();location.search='?q='+encodeURIComponent(q.value.trim())};const go=x=>location.search='?q='+encodeURIComponent(q.value)+'&page='+x;async function load(){if(q.value.length<2){s.textContent='';return}try{const d=await fetch('/api/search?q='+encodeURIComponent(q.value)+'&page='+n).then(x=>x.json());s.textContent=`${d.total} resultado(s), página ${d.page}.`;r.innerHTML='';if(!d.items.length){r.textContent='No encontramos contenido para esta búsqueda.';return}d.items.forEach(i=>{const a=document.createElement('a');a.className='result';a.href='/contenido.html?kind='+i.kind+'&slug='+encodeURIComponent(i.slug);const title=document.createElement('strong');title.textContent=i.title;const meta=document.createElement('small');meta.textContent=i.kind==='page'?'Página':'Entrada';a.append(title,meta);r.append(a)});p.innerHTML='';if(d.page>1){const b=document.createElement('button');b.textContent='← Anterior';b.onclick=()=>go(d.page-1);p.append(b)}if(d.page*10<d.total){const b=document.createElement('button');b.textContent='Siguiente →';b.onclick=()=>go(d.page+1);p.append(b)}}catch{ s.textContent='No se pudo realizar la búsqueda. Inténtalo otra vez.'}}load()</script>
