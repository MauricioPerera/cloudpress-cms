<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Importar · CloudPress</title><style>body{font:16px system-ui;background:#f0f0f1;color:#1d2327;margin:0}main{max-width:760px;margin:50px auto;background:#fff;border:1px solid #dcdcde;padding:30px}input,button{font:inherit;margin:10px 0;padding:10px}button{background:#2271b1;border:1px solid #2271b1;color:#fff}.secondary{background:#fff;color:#2271b1}button:disabled{opacity:.55}.card{background:#f6f7f7;border-left:4px solid #2271b1;padding:16px;margin:16px 0}a{color:#2271b1}.muted{color:#646970}</style><main><p><a href="/admin.html">← Administración</a></p><h1>Restaurar respaldo</h1><p>Importa un JSON generado por CloudPress. Restaura contenido, taxonomías, menú, comentarios, revisiones y ajustes del sitio. Nunca importa usuarios, contraseñas, sesiones ni archivos multimedia.</p><input id="file" type="file" accept="application/json,.json"><br><button id="preview" class="secondary">Vista previa</button><button id="import-btn" disabled>Restaurar ahora</button><div id="message" class="muted" role="status"></div><div id="summary"></div></main><script>
const $=s=>document.querySelector(s);let payload=null;const api=async body=>{const r=await fetch('/api/admin/import',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw Error(d.error||'Error');return d};const n=(o,k)=>o&&Number.isFinite(o[k])?o[k]:0;
function show(r){summary.innerHTML='';const box=document.createElement('div');box.className='card';[`Contenido nuevo: ${n(r.created,'content')}`,`Términos nuevos: ${n(r.created,'terms')} · reutilizados: ${n(r.reused,'terms')}`,`Relaciones: ${n(r.created,'relations')} · omitidas: ${n(r.skipped,'relations')}`,`Elementos de menú: ${n(r.created,'menu')} · omitidos: ${n(r.skipped,'menu')}`,`Comentarios: ${n(r.created,'comments')} · omitidos: ${n(r.skipped,'comments')}`,`Revisiones: ${n(r.created,'revisions')} · omitidas: ${n(r.skipped,'revisions')}`,`Ajustes del sitio restaurados: ${n(r.created,'settings')}`,`Slugs renombrados por conflicto: contenido ${n(r.renamed,'content')}, términos ${n(r.renamed,'terms')}`].forEach(x=>{const p=document.createElement('div');p.textContent=x;box.append(p)});summary.append(box)}
$('#preview').onclick=async()=>{try{const f=file.files[0];if(!f)throw Error('Selecciona un archivo JSON.');if(f.size>2*1024*1024)throw Error('El archivo supera 2 MB.');payload=JSON.parse(await f.text());message.textContent='Calculando vista previa…';const r=await api({...payload,dryRun:true});show(r);message.textContent='Vista previa lista. Se añadirá contenido; los ajustes del respaldo reemplazarán los actuales.';$('#import-btn').disabled=false}catch(e){payload=null;$('#import-btn').disabled=true;summary.innerHTML='';message.textContent=e.message}};
$('#import-btn').onclick=async()=>{if(!payload)return;if(!await CloudPressUI.confirm({title:'Restaurar respaldo',message:'Se añadirá el contenido de la vista previa. Los ajustes incluidos reemplazarán los ajustes actuales.',confirmLabel:'Restaurar ahora',destructive:true}))return;try{$('#import-btn').disabled=true;message.textContent='Restaurando…';const r=await api(payload);show(r);message.textContent='Restauración completada.';CloudPressUI.toast('Respaldo restaurado.')}catch(e){message.textContent=e.message;$('#import-btn').disabled=false}};
</script>
