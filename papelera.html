<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Papelera · CloudPress</title><style>body{font:15px system-ui;background:#f0f0f1;margin:0;color:#1d2327}main{max-width:1060px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #dcdcde;padding:20px;margin:16px 0}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:8px}button{background:#2271b1;color:#fff;border:1px solid #2271b1}.delete{background:#fff;color:#b32d2e;border-color:#b32d2e}.muted{color:#646970}.item{border-bottom:1px solid #dcdcde;padding:16px 0}.item:last-child{border:0}</style><main><h1>Papelera</h1><p class="muted">El contenido enviado aquí no aparece en el sitio público. Puedes restaurarlo o eliminarlo definitivamente.</p><div class="toolbar"><label>Tipo <select id="kind"><option value="">Entradas y páginas</option><option value="post">Entradas</option><option value="page">Páginas</option></select></label><button id="reload">Actualizar</button></div><div id="message" class="muted" role="status">Cargando…</div><section id="items"></section></main><script>
const $=s=>document.querySelector(s),kind=$('#kind'),reload=$('#reload'),message=$('#message'),items=$('#items');const api=async(p,m='GET')=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'}}),d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw Error(d.error||'Error');return d};const add=(p,t,v,c)=>{const n=document.createElement(t);n.textContent=v;if(c)n.className=c;p.append(n);return n};
async function load(){try{items.innerHTML='';message.textContent='Cargando…';const d=await api('/api/admin/entries?status=trash'+(kind.value?'&kind='+kind.value:''));message.textContent=d.items.length?`${d.items.length} elemento(s) en la papelera.`:'La papelera está vacía.';d.items.forEach(i=>{const el=document.createElement('article');el.className='card item';add(el,'strong',i.title);add(el,'div',`${i.kind==='page'?'Página':'Entrada'} · antes era ${i.trashed_from_status==='published'?'publicado':'borrador'} · ${new Date(i.trashed_at).toLocaleString()}`,'muted');const actions=document.createElement('div');actions.className='toolbar';const restore=document.createElement('button');restore.textContent='Restaurar';restore.onclick=async()=>{try{await api('/api/admin/trash/'+i.id,'POST');CloudPressUI.toast('Contenido restaurado.');load()}catch(e){message.textContent=e.message}};const purge=document.createElement('button');purge.className='delete';purge.textContent='Eliminar definitivamente';purge.onclick=async()=>{if(!await CloudPressUI.confirm({title:'Eliminar definitivamente',message:'El contenido se perderá de forma permanente y no podrá recuperarse.',confirmLabel:'Eliminar definitivamente',destructive:true}))return;try{await api('/api/admin/trash/'+i.id,'DELETE');CloudPressUI.toast('Contenido eliminado definitivamente.');load()}catch(e){message.textContent=e.message}};actions.append(restore,purge);el.append(actions);items.append(el)})}catch(e){message.textContent=e.message}}
kind.onchange=load;reload.onclick=load;load();
</script>
