<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceder ‹ CloudPress</title><style>body{margin:0;background:#f0f0f1;color:#1d2327;font:14px/1.5 system-ui}.login{max-width:320px;margin:8vh auto;padding:24px;background:#fff;border:1px solid #c3c4c7}.brand{text-align:center;font-size:26px;font-weight:800;margin-bottom:22px}.brand span{color:#2271b1}label{display:block;font-weight:600;margin:14px 0 5px}input{box-sizing:border-box;width:100%;font:inherit;padding:9px;border:1px solid #8c8f94}button{width:100%;margin-top:18px;background:#2271b1;color:#fff;border:1px solid #2271b1;padding:9px;font:inherit;font-weight:600}.links{display:flex;justify-content:space-between;margin-top:16px}a{color:#2271b1;text-decoration:none}#message{min-height:20px;color:#b32d2e;margin-top:10px}</style><main class="login"><div class="brand">Cloud<span>Press</span></div><label>Usuario o correo<input id="username" autocomplete="username" autofocus></label><label>Contraseña<input id="password" type="password" autocomplete="current-password"></label><button id="login">Acceder</button><div id="message" role="alert"></div><div class="links"><a href="/forgot-password.html">¿Olvidaste tu contraseña?</a><a href="/">← Volver al sitio</a></div></main><script>const message=document.querySelector('#message');async function login(){message.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})}),d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo iniciar sesión');location.href=d.user.role==='admin'?'/wp-admin.html':d.user.role==='author'?'/editor.html':'/'}catch(e){message.textContent=e.message}}loginBtn=document.querySelector('#login');loginBtn.onclick=login;password.onkeydown=e=>{if(e.key==='Enter')login()}</script>
