<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/admin-guard.js"></script><title>Permisos de plugins · CloudPress</title><style>html:not(.authenticated)body{visibility:hidden}body{font:16px system-ui;background:#f0f0f1;margin:0;color:#1d2327}main{max-width:900px;margin:auto;padding:30px}.card{background:#fff;border:1px solid #dcdcde;padding:20px;margin:16px 0}.cap{border-top:1px solid #ddd;padding:14px 0}.cap:first-child{border:0}label{display:inline-block;margin:6px 12px 6px 0}button{font:inherit;padding:9px 13px;background:#2271b1;color:#fff;border:1px solid #2271b1}.muted{color:#646970}</style><main><p><a href="/roles.html">← Roles</a></p><h1>Capacidades de plugins</h1><p class="muted">Asigna capacidades declaradas por plugins activos a roles de gestión o externos.</p><div id="app" class="card">Cargando…</div></main><script>(()=>{const app=document.querySelector('#app');const api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d};async function load(){try{const d=await api('/api/admin/plugin-capabilities');app.replaceChildren();if(!d.plugins.length){app.textContent='No hay plugins activos con capacidades.';return}d.plugins.forEach(p=>{const h=document.createElement('h2');h.textContent=p.id;app.append(h);p.capabilities.forEach(c=>{const box=document.createElement('section');box.className='cap';const title=document.createElement('strong');title.textContent=c.label;box.append(title);const form=document.createElement('form');d.roles.forEach(role=>{const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.value=role.id;i.checked=c.roles.includes(role.id);l.append(i,` ${role.label} (${role.scope==='management'?'gestión':'externo'})`);form.append(l)});const save=document.createElement('button');save.textContent='Guardar';form.append(document.createElement('br'),save);form.onsubmit=async e=>{e.preventDefault();try{await api(`/api/admin/plugins/${encodeURIComponent(p.id)}/capabilities`,'PUT',{capabilityId:c.id,roles:[...form.querySelectorAll(':checked')].map(x=>x.value)});save.textContent='Guardado';setTimeout(()=>save.textContent='Guardar',900)}catch(e){save.textContent=e.message}};box.append(form);app.append(box)})})}catch(e){app.textContent=e.message}}load()})()</script>
