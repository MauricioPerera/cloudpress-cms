<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/admin-guard.js"></script><style>html:not(.authenticated) body{visibility:hidden}body{font:15px system-ui;background:#f0f0f1;color:#1d2327;margin:0}main{max-width:1000px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #dcdcde;padding:20px;margin:16px 0}button{font:inherit;padding:8px 12px;background:#2271b1;color:#fff;border:1px solid #2271b1;margin-right:7px}.secondary{background:#fff;color:#2271b1}.danger{background:#fff;color:#b32d2e;border-color:#b32d2e}.bad{color:#b32d2e}.ok{color:#008a20}textarea{width:100%;min-height:130px;font:13px ui-monospace,monospace;padding:10px}.meta{color:#646970;font-size:13px}</style><main><h1>Plugins</h1><p>Solo se instalan plugins incluidos en la versión desplegada y que cumplen el contrato <code>cloudpress-plugin/v1</code>.</p><div class="card"><h2>Plugins disponibles</h2><div id="list">Cargando…</div></div><div class="card"><h2>Validar manifiesto</h2><p class="meta">Útil para autores o agentes antes de solicitar instalación.</p><textarea id="manifest" aria-label="Manifiesto JSON"></textarea><p><button id="validate">Validar contrato</button></p><pre id="result"></pre></div></main><script>const $=s=>document.querySelector(s),list=$('#list'),manifest=$('#manifest'),result=$('#result'),validate=$('#validate');const api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d};let data;function showError(e){result.textContent=e.message;result.className='bad'}function render(){list.innerHTML='';const installed=new Map(data.installed.map(x=>[x.plugin_id,x]));data.available.forEach(plugin=>{const row=document.createElement('section'),state=installed.get(plugin.id),valid=state?'Instalado: '+state.status:'No instalado';row.innerHTML=`<h3>${plugin.name} <small class="meta">v${plugin.version}</small></h3><p>${plugin.description}</p><p class="meta">Hooks: ${plugin.hooks.join(', ')} · Permisos: ${plugin.permissions.join(', ')}</p><p><strong class="${state?.status==='enabled'?'ok':''}">${valid}</strong></p>`;const toggle=document.createElement('button');toggle.textContent=state?(state.status==='enabled'?'Desactivar':'Activar'):'Instalar';toggle.onclick=async()=>{try{if(!state)await api('/api/admin/plugins','POST',{id:plugin.id});else await api('/api/admin/plugins/'+plugin.id,'PATCH',{status:state.status==='enabled'?'disabled':'enabled'});await load()}catch(e){showError(e)}};row.append(toggle);if(state){const remove=document.createElement('button');remove.className='danger';remove.textContent='Desinstalar';remove.onclick=async()=>{if(!confirm('¿Desinstalar este plugin? Sus declaraciones dejarán de estar activas.'))return;try{await api('/api/admin/plugins/'+plugin.id,'DELETE');await load()}catch(e){showError(e)}};row.append(remove)}list.append(row)})}async function load(){data=await api('/api/admin/plugins');manifest.value=JSON.stringify(data.available[0]||{},null,2);render()}validate.onclick=async()=>{try{const v=await api('/api/admin/plugins/validate','POST',JSON.parse(manifest.value));result.className=v.valid?'ok':'bad';result.textContent=v.valid?'Contrato válido.':v.errors.join('\n')}catch(e){showError(e)}};load().catch(showError)</script>
