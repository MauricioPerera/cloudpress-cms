<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exportar · CloudPress</title><style>body{font:16px system-ui;background:#f0f0f1;color:#1d2327;margin:0}main{max-width:700px;margin:70px auto;background:#fff;border:1px solid #dcdcde;padding:30px}button{font:inherit;background:#2271b1;color:#fff;border:1px solid #2271b1;padding:10px 16px}a{color:#2271b1}</style><main><p><a href="/admin.html">← Administración</a></p><h1>Exportar contenido</h1><p>Descarga entradas, páginas, categorías, etiquetas y menú en formato JSON. No incluye usuarios, contraseñas ni sesiones.</p><button id="download">Descargar exportación</button><p id="message"></p></main><script>download.onclick=async()=>{message.textContent='Preparando…';try{const r=await fetch('/api/admin/export');if(!r.ok)throw Error('No se pudo exportar');const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cloudpress-export.json';a.click();URL.revokeObjectURL(a.href);message.textContent='Exportación descargada.'}catch(e){message.textContent=e.message}}</script>
