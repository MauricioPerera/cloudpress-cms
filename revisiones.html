<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisiones · CloudPress</title><style>body{font:15px system-ui;background:#f0f0f1;margin:0;color:#1d2327}main{max-width:1060px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #dcdcde;padding:20px;margin:16px 0}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:8px}button{background:#2271b1;color:#fff;border:1px solid #2271b1}.secondary{background:#fff;color:#2271b1}.muted{color:#646970}.revision{border-bottom:1px solid #dcdcde;padding:16px 0}.revision:last-child{border:0}p{white-space:pre-wrap}a{color:#2271b1;text-decoration:none}</style><main><p><a href="/admin.html">← Administración</a></p><h1>Revisiones</h1><div class="card"><p class="muted">Cada edición guarda automáticamente la versión anterior. Restaurar una revisión también conserva el estado actual para poder deshacer la restauración.</p><div class="toolbar"><label for="content">Entrada o página</label><select id="content"></select><button id="reload" class="secondary">Actualizar</button></div></div><div id="message" class="muted" role="status">Cargando contenido…</div><section id="revisions"></section></main><script>
const $=s=>document.querySelector(s),content=$('#content'),message=$('#message'),revisions=$('#revisions');const api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}),d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw Error(d.error||'Error');return d};const add=(parent,tag,value,cls)=>{const n=document.createElement(tag);n.textContent=value;if(cls)n.className=cls;parent.append(n);return n};
async function loadRevisions(){const id=content.value;revisions.innerHTML='';if(!id){message.textContent='No hay entradas ni páginas.';return}try{message.textContent='Cargando revisiones…';const data=await api('/api/admin/content/'+id+'/revisions');message.textContent=data.revisions.length?`${data.revisions.length} revisión(es) disponibles.`:'Aún no hay revisiones para este contenido.';data.revisions.forEach(r=>{const article=document.createElement('article');article.className='card revision';add(article,'strong',r.title);add(article,'div',`${r.kind==='page'?'Página':'Entrada'} · ${r.status==='published'?'Publicado':'Borrador'} · ${new Date(r.created_at+'Z').toLocaleString()}`,'muted');if(r.excerpt)add(article,'p',r.excerpt);if(r.body)add(article,'p',r.body.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,280));const action=document.createElement('button');action.textContent='Restaurar esta revisión';action.onclick=async()=>{if(!await CloudPressUI.confirm({title:'Restaurar revisión',message:'La versión actual se guardará antes de restaurar esta revisión.',confirmLabel:'Restaurar revisión'}))return;try{await api('/api/admin/content/'+id+'/revisions/'+r.id,'POST',{});CloudPressUI.toast('Revisión restaurada.');await loadRevisions()}catch(e){message.textContent=e.message}};article.append(action);revisions.append(article)})}catch(e){message.textContent=e.message}}
async function loadContent(){try{message.textContent='Cargando contenido…';const [posts,pages]=await Promise.all([api('/api/admin/content?kind=post'),api('/api/admin/content?kind=page')]);const items=[...posts.items,...pages.items].sort((a,b)=>a.title.localeCompare(b.title));content.innerHTML='';items.forEach(i=>{const option=document.createElement('option');option.value=i.id;option.textContent=`${i.kind==='page'?'Página':'Entrada'}: ${i.title}`;content.append(option)});await loadRevisions()}catch(e){message.textContent=e.message}}
content.onchange=loadRevisions;$('#reload').onclick=loadContent;loadContent();
</script>
