<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil · CloudPress</title><style>body{font:16px system-ui;background:#f0f0f1;color:#1d2327;margin:0}main{max-width:700px;margin:50px auto;background:#fff;border:1px solid #dcdcde;padding:30px}label{display:block;font-weight:600;margin:15px 0}input,textarea{font:inherit;box-sizing:border-box;width:100%;padding:9px;margin-top:6px;border:1px solid #8c8f94}button{font:inherit;background:#2271b1;color:#fff;border:1px solid #2271b1;padding:10px 16px;margin-top:12px}a{color:#2271b1}.muted{color:#646970}.card{border-top:1px solid #dcdcde;margin-top:25px;padding-top:15px}.secret{word-break:break-all;background:#f6f7f7;padding:10px}.warn{background:#fcf9e8;border-left:4px solid #dba617;padding:10px}</style><main><p id="back"><a href="/">← Volver</a></p><h1>Tu perfil</h1><p id="role" class="muted"></p><form id="profile"><label>Nombre de usuario<input id="username" name="username" required maxlength="40"></label><label>Correo electrónico<input id="email" name="email" type="email" maxlength="254"></label><button>Guardar perfil</button></form><form id="password" class="card"><h2>Cambiar contraseña</h2><label>Contraseña actual<input name="currentPassword" type="password" required autocomplete="current-password"></label><label>Nueva contraseña<input name="password" type="password" required minlength="10" autocomplete="new-password"></label><button>Actualizar contraseña</button></form><section class="card"><h2>Google Authenticator</h2><p id="totp-status" class="muted"></p><form id="totp-setup"><label>Confirma tu contraseña para activar el autenticador<input name="currentPassword" type="password" required autocomplete="current-password"></label><button>Generar clave para autenticador</button></form><div id="totp-secret" hidden><p>En Google Authenticator elige <strong>Introducir una clave de configuración</strong>. Copia esta clave y usa una cuenta basada en tiempo.</p><p class="secret" id="manual-key"></p><label>URI de configuración (no la compartas)<textarea id="otpauth-uri" readonly rows="3"></textarea></label><form id="totp-confirm"><label>Escribe el código de 6 dígitos que muestra la app<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label><button>Confirmar y activar</button></form></div><div id="recovery-codes" class="warn" hidden><strong>Guarda estos códigos de respaldo ahora.</strong> Cada uno funciona una sola vez y no volverán a mostrarse.<pre id="codes"></pre></div></section><p id="message" class="muted" role="status"></p></main><script>const $=s=>document.querySelector(s),profileForm=$('#profile'),passwordForm=$('#password'),username=$('#username'),email=$('#email'),role=$('#role'),message=$('#message'),back=$('#back a'),setup=$('#totp-setup'),confirm=$('#totp-confirm'),secret=$('#totp-secret');const api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}),d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw Error(d.error||'Error');return d};async function load(){try{const d=await api('/api/profile');username.value=d.profile.username;email.value=d.profile.email||'';role.textContent='Rol: '+d.profile.role;back.href=d.profile.role==='admin'?'/wp-admin':d.profile.role==='author'?'/editor.html':'/';$('#totp-status').textContent=d.profile.totp_enabled?'Autenticador activo. Puedes recuperar la cuenta sin correo.':'Aún no has activado un autenticador.';setup.hidden=Boolean(d.profile.totp_enabled)}catch(e){message.textContent=e.message}}profileForm.onsubmit=async e=>{e.preventDefault();try{await api('/api/profile','PATCH',Object.fromEntries(new FormData(profileForm)));message.textContent='Perfil actualizado.';load()}catch(e){message.textContent=e.message}};passwordForm.onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/profile','PATCH',Object.fromEntries(new FormData(passwordForm)));if(r.passwordChanged){message.textContent='Contraseña actualizada. Inicia sesión nuevamente.';setTimeout(()=>location.href='/login.html',700)}}catch(e){message.textContent=e.message}};setup.onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/profile/totp/setup','POST',Object.fromEntries(new FormData(setup)));$('#manual-key').textContent=d.manualKey;$('#otpauth-uri').value=d.otpauthUri;secret.hidden=false;setup.hidden=true;message.textContent='Escanea o registra la clave, después confirma un código.'}catch(e){message.textContent=e.message}};confirm.onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/profile/totp/confirm','POST',Object.fromEntries(new FormData(confirm)));$('#codes').textContent=d.recoveryCodes.join('\n');$('#recovery-codes').hidden=false;secret.hidden=true;message.textContent='Autenticador activado.';load()}catch(e){message.textContent=e.message}};load()</script>
