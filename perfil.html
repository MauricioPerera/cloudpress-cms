<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil · CloudPress</title><style>body{font:16px system-ui;background:#f0f0f1;color:#1d2327;margin:0}main{max-width:700px;margin:50px auto;background:#fff;border:1px solid #dcdcde;padding:30px}label{display:block;font-weight:600;margin:15px 0}input{font:inherit;box-sizing:border-box;width:100%;padding:9px;margin-top:6px;border:1px solid #8c8f94}button{font:inherit;background:#2271b1;color:#fff;border:1px solid #2271b1;padding:10px 16px;margin-top:12px}a{color:#2271b1}.muted{color:#646970}.card{border-top:1px solid #dcdcde;margin-top:25px;padding-top:15px}</style><main><p id="back"><a href="/">← Volver</a></p><h1>Tu perfil</h1><p id="role" class="muted"></p><form id="profile"><label>Nombre de usuario<input id="username" name="username" required maxlength="40"></label><label>Correo electrónico<input id="email" name="email" type="email" maxlength="254"></label><button>Guardar perfil</button></form><form id="password" class="card"><h2>Cambiar contraseña</h2><label>Contraseña actual<input name="currentPassword" type="password" required autocomplete="current-password"></label><label>Nueva contraseña<input name="password" type="password" required minlength="10" autocomplete="new-password"></label><button>Actualizar contraseña</button></form><p id="message" class="muted" role="status"></p></main><script>const $=s=>document.querySelector(s),profileForm=$('#profile'),passwordForm=$('#password'),username=$('#username'),email=$('#email'),role=$('#role'),message=$('#message'),back=$('#back a');const api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}),d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw Error(d.error||'Error');return d};async function load(){try{const d=await api('/api/profile');username.value=d.profile.username;email.value=d.profile.email||'';role.textContent='Rol: '+d.profile.role;back.href=d.profile.role==='admin'?'/wp-admin':d.profile.role==='author'?'/editor.html':'/'}catch(e){message.textContent=e.message}}profileForm.onsubmit=async e=>{e.preventDefault();try{await api('/api/profile','PATCH',Object.fromEntries(new FormData(profileForm)));message.textContent='Perfil actualizado.';load()}catch(e){message.textContent=e.message}};passwordForm.onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/profile','PATCH',Object.fromEntries(new FormData(passwordForm)));if(r.passwordChanged){message.textContent='Contraseña actualizada. Inicia sesión nuevamente.';setTimeout(()=>location.href='/login.html',700)}}catch(e){message.textContent=e.message}};load()</script>
