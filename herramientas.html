<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/admin-guard.js"></script><style>html:not(.authenticated) body{visibility:hidden}body{font:15px system-ui;background:#f0f0f1;margin:0;color:#1d2327}main{max-width:840px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #dcdcde;padding:20px;margin:16px 0}.button{background:#2271b1;color:#fff;border:1px solid #2271b1;padding:9px 12px;font:inherit;cursor:pointer;margin-right:8px}</style><main><h1>Herramientas</h1><p>Importa, exporta y conserva una copia del contenido de CloudPress.</p><section class="card"><h2>Importar</h2><p>Restaura contenido, términos, comentarios y ajustes desde un respaldo JSON.</p><button class="button" data-open="import">Ir a importar</button></section><section class="card"><h2>Exportar</h2><p>Descarga una copia JSON del contenido y la configuración del sitio.</p><button class="button" data-open="export">Ir a exportar</button></section></main><script>document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>parent.document.querySelector(`[data-view="${b.dataset.open}"]`)?.click())</script>
