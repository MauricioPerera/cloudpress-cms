<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/admin-guard.js"></script><title>Contenido · CloudPress</title><style>body{font:15px system-ui;margin:32px auto;max-width:900px;padding:0 18px;background:#f5f7fb;color:#172033}.card{background:#fff;border:1px solid #d9e0ec;border-radius:9px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:5px;margin:10px 0}input,textarea,select{font:inherit;padding:9px}textarea{min-height:120px}button{padding:9px 13px;background:#1769aa;color:#fff;border:0;border-radius:4px}.item{border-top:1px solid #ddd;padding:12px 0}.muted{color:#5e6c80}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><main><p><a href="/content-types.html">← Tipos de contenido</a></p><h1 id="heading">Contenido</h1><form id="form" class="card"><div class="grid"><label>Título <input name="title" required maxlength="180"></label><label>Slug <input name="slug"></label></div><label id="body-wrap">Contenido <textarea name="body"></textarea></label><section id="fields"></section><button>Guardar borrador</button><p id="message"></p></form><section class="card"><h2>Elementos</h2><div id="list">Cargando…</div></section></main><script>(()=>{const type=new URLSearchParams(location.search).get('type'),$=s=>document.querySelector(s),form=$('#form'),fields=$('#fields'),list=$('#list'),message=$('#message'),api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:b?{'content-type':'application/json'}:{},body:b?JSON.stringify(b):undefined}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error');return d};let defs=[];const fieldInput=f=>{const name='custom:'+f.field_id;if(f.value_type==='boolean')return `<label><input type="checkbox" name="${name}"> ${f.label}${f.required?' *':''}</label>`;if(f.value_type==='reference')return `<label>${f.label}${f.required?' *':''}<select name="${name}" ${f.required?'required':''}><option value="">Selecciona…</option></select></label>`;const kind=f.value_type==='date'?'date':f.value_type==='number'?'number':'text';return `<label>${f.label}${f.required?' *':''}<input type="${kind}" name="${name}" ${f.required?'required':''}></label>`};const refresh=async()=>{const [schema,fieldData,items]=await Promise.all([api('/api/admin/plugin-schema'),api('/api/admin/content-fields?type='+encodeURIComponent(type)),api('/api/admin/content?contentType='+encodeURIComponent(type))]);const definition=schema.contentTypes.find(x=>x.type_id===type&&x.source==='core');if(!definition)throw Error('Tipo propio no disponible.');defs=fieldData.fields;$('#heading').textContent=definition.label;$('#body-wrap').hidden=!definition.supports.includes('body');fields.innerHTML=defs.length?'<h2>Campos</h2>'+defs.map(fieldInput).join(''):'';for(const f of defs.filter(x=>x.value_type==='reference')){const target=await api('/api/admin/content?contentType='+encodeURIComponent(f.relation_type));const select=form.elements['custom:'+f.field_id];for(const item of target.items){const option=document.createElement('option');option.value=item.id;option.textContent=item.title;select.append(option)}}list.replaceChildren();if(!items.items.length){list.textContent='Aún no hay contenido.'}else for(const item of items.items){const row=document.createElement('div');row.className='item';row.textContent=item.title+' · '+item.status;list.append(row)}};form.onsubmit=async e=>{e.preventDefault();try{const fd=new FormData(form),customFields={};for(const f of defs){const raw=f.value_type==='boolean'?form.elements['custom:'+f.field_id].checked:fd.get('custom:'+f.field_id);if(raw!==''&&raw!==null)customFields[f.field_id]=(f.value_type==='number'||f.value_type==='reference')?Number(raw):raw}await api('/api/admin/content','POST',{kind:'post',contentType:type,title:fd.get('title'),slug:fd.get('slug'),body:fd.get('body'),status:'draft',customFields});form.reset();message.textContent='Borrador guardado.';refresh()}catch(e){message.textContent=e.message}};refresh().catch(e=>{message.textContent=e.message;form.hidden=true})})();</script>
