<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/admin-guard.js"></script><title>Metadatos · CloudPress</title><style>html:not(.authenticated)body{visibility:hidden}body{margin:0;background:#f0f0f1;color:#1d2327;font:14px system-ui}main{max-width:1180px;margin:auto;padding:28px}.head,.actions{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}.head h1{margin:0;font-size:24px}.muted,.help{color:#646970}.help{font-size:12px;margin:5px 0}.card{background:#fff;border:1px solid #dcdcde;border-radius:6px;padding:20px;margin:18px 0;box-shadow:0 1px 2px #0000000d}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}.field{display:grid;gap:6px;margin:12px 0;font-weight:600}.field input,.field select{height:40px}.field input,.field select{box-sizing:border-box;width:100%;padding:8px;border:1px solid #8c8f94;background:#fff;font:inherit}.button{border:1px solid #2271b1;background:#2271b1;color:#fff;padding:8px 13px;border-radius:3px;font:inherit;font-weight:600;cursor:pointer}.button.secondary{background:#fff;color:#2271b1}.button.danger{border-color:#b32d2e;background:#fff;color:#b32d2e}.notice{padding:11px 13px;background:#fff;border-left:4px solid #2271b1}.notice.error{border-color:#d63638}.group{border:1px solid #dcdcde;border-radius:4px;padding:14px;margin:12px 0}.group h3{margin:0}.field-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #f0f0f1}.field-row:last-child{border-bottom:0}@media(max-width:720px){main{padding:16px}.grid{grid-template-columns:1fr}}</style><main><header class="head"><div><h1>Metadatos personalizados</h1><p class="muted">Define campos tipados que se validan antes de guardar contenido.</p></div><button id="new-group" class="button">Añadir grupo</button></header><div id="notice" class="notice" role="status">Cargando…</div><section id="workspace"></section></main><scri const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b===undefined?undefined:JSON.stringify(b)}),d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d};let groups=[],types=[];const note=(m,error=false)=>{const x=$('#notice');x.textContent=m;x.className='notice'+(error?' error':'')};
async function loadTypes(){const [core,schema]=await Promise.all([api('/api/admin/content-types'),api('/api/admin/plugin-schema')]);types=[{type_id:'post',label:'Entradas'},{type_id:'page',label:'Páginas'},...core.types.map(x=>({type_id:x.type_id,label:x.label})),...schema.contentTypes.map(x=>({type_id:x.type_id,label:x.label}))].filter((x,i,a)=>a.findIndex(y=>y.type_id===x.type_id)===i)}
const typeOptions=(selected='')=>types.map(x=>`<option value="${esc(x.type_id)}" ${x.type_id===selected?'selected':''}>${esc(x.label)} (${esc(x.type_id)})</option>`).join('');
function groupEditor(group={active:true}){const root=$('#workspace');root.innerHTML=`<section class="card"><div class="head"><div><h2>${group.group_id?'Editar grupo':'Nuevo grupo'}</h2><p class="muted">Un grupo se aplica a un único tipo de contenido.</p></div><button id="cancel" class="button secondary">Cancelar</button></div><form id="group-form"><div class="grid"><label class="field">Identificador<input name="groupId" required pattern="[a-z][a-z0-9-]{2,47}" ${group.group_id?'readonly':''} value="${esc(group.group_id||'')}"><span class="help">Minúsculas, números y guiones. No cambia después de crear.</span></label><label class="field">Título<input name="title" required maxlength="100" value="${esc(group.title||'')}"></label></div><label class="field">Aplicar a<select name="contentType" required>${typeOptions(group.content_type)}</select></label><label><input type="checkbox" name="active" ${group.active!==false?'checked':''}> Grupo activo</label><p><button class="button">${group.group_id?'Guardar cambios':'Crear grupo'}</button></p></form></section>`;$('#cancel').onclick=render;$('#group-form').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.currentTarget),body={action:'group',groupId:d.get('groupId'),title:d.get('title'),contentType:d.get('contentType'),active:d.has('active')};try{await api('/api/admin/advanced-fields',group.group_id?'PATCH':'POST',body);note('Grupo guardado.');await refresh()}catch(x){note(x.message,true)}}}
function fieldEditor(group,field={}){const root=$('#workspace');root.innerHTML=`<section class="card"><div class="head"><div><h2>${field.field_id?'Editar campo':'Nuevo campo'} · ${esc(group.title)}</h2><p class="muted">El valor se valida en el servidor, también cuando lo guarda un agente.</p></div><button id="cancel" class="button secondary">Cancelar</button></div><form id="field-form"><div class="grid"><label class="field">Identificador<input name="fieldId" required pattern="[a-z][a-z0-9-]{1,47}" ${field.field_id?'readonly':''} value="${esc(field.field_id||'')}"></label><label class="field">Etiqueta<input name="label" required maxlength="100" value="${esc(field.label||'')}"></label></div><div class="grid"><label class="field">Tipo<select name="valueType">${['text:Texto breve','textarea:Texto largo','number:Número','boolean:Sí / no','date:Fecha','email:Correo','url:URL','select:Selección','reference:Referencia de contenido'].map(x=>{const [v,l]=x.split(':');return `<option value="${v}" ${field.value_type===v?'selected':''}>${l}</option>`}).join('')}</select></label><label class="field">Longitud máxima (texto)<input name="maxLength" type="number" min="1" max="10000" value="${esc(field.settings?.maxLength||'')}"></label></div><label class="field conditional reference">Tipo de contenido relacionado<select name="relationType"><option value="">Selecciona…</option>${typeOptions(field.relation_type)}</select></label><label class="field conditional select">Opciones, una por línea<input name="options" value="${esc((field.settings?.options||[]).join(' | '))}"><span class="help">Sepáralas con “ | ”.</span></label><label><input type="checkbox" name="required" ${field.required?'checked':''}> Obligatorio</label><p><button class="button">${field.field_id?'Guardar cambios':'Añadir campo'}</button></p></form></section>`;const form=$('#field-form'),sync=()=>{const t=form.valueType.value;form.querySelector('.reference').hidden=t!=='reference';form.querySelector('.select').hidden=t!=='select';form.maxLength.closest('label').hidden=!['text','textarea'].includes(t)};form.valueType.onchange=sync;sync();$('#cancel').onclick=render;form.onsubmit=async e=>{e.preventDefault();const d=new FormData(form),type=d.get('valueType'),settings={};if(d.get('maxLength'))settings.maxLength=Number(d.get('maxLength'));if(type==='select')settings.options=d.get('options').split('|').map(x=>x.trim()).filter(Boolean);const body={action:'field',groupId:group.group_id,fieldId:d.get('fieldId'),label:d.get('label'),valueType:type,required:d.has('required'),relationType:type==='reference'?d.get('relationType'):null,settings};try{await api('/api/admin/advanced-fields',field.field_id?'PATCH':'POST',body);note('Campo guardado.');await refresh()}catch(x){note(x.message,true)}}}
async function removeGroup(group){if(!await CloudPressUI.confirm({title:'Eliminar grupo',message:'Sólo puede eliminarse si no conserva valores.',confirmLabel:'Eliminar',destructive:true}))return;try{await api(`/api/admin/advanced-fields?group=${encodeURIComponent(group.group_id)}`,'DELETE');note('Grupo eliminado.');await refresh()}catch(x){note(x.message,true)}}
async function removeField(group,field){if(!await CloudPressUI.confirm({title:'Eliminar campo',message:'Sólo puede eliminarse si no conserva valores.',confirmLabel:'Eliminar',destructive:true}))return;try{await api(`/api/admin/advanced-fields?group=${encodeURIComponent(group.group_id)}&field=${encodeURIComponent(field.field_id)}`,'DELETE');note('Campo eliminado.');await refresh()}catch(x){note(x.message,true)}}
function render(){const root=$('#workspace');root.innerHTML=`<section class="card"><h2>Grupos configurados</h2>${groups.map(g=>`<article class="group"><div class="head"><div><h3>${esc(g.title)}</h3><p class="muted">${esc(types.find(x=>x.type_id===g.content_type)?.label||g.content_type)} · ${g.active?'Activo':'Inactivo'}</p></div><div class="actions"><button class="button secondary" data-edit-group="${esc(g.group_id)}">Editar grupo</button><button class="button danger" data-remove-group="${esc(g.group_id)}">Eliminar</button></div></div><div>${g.fields.map(f=>`<div class="field-row"><span><strong>${esc(f.label)}</strong><br><small class="muted">${esc(f.field_id)} · ${esc(f.value_type)}${f.required?' · obligatorio':''}</small></span><span><button class="button secondary" data-edit-field="${esc(g.group_id)}|${esc(f.field_id)}">Editar</button> <button class="button danger" data-remove-field="${esc(g.group_id)}|${esc(f.field_id)}">Eliminar</button></span></div>`).join('')||'<p class="muted">Aún no tiene campos.</p>'}</div><p><button class="button" data-add-field="${esc(g.group_id)}">Añadir campo</button></p></article>`).join('')||'<p class="muted">Aún no hay grupos. Crea uno para empezar.</p>'}</section>`;root.querySelectorAll('[data-edit-group]').forEach(b=>b.onclick=()=>groupEditor(groups.find(g=>g.group_id===b.dataset.editGroup)));root.querySelectorAll('[data-remove-group]').forEach(b=>b.onclick=()=>removeGroup(groups.find(g=>g.group_id===b.dataset.removeGroup)));root.querySelectorAll('[data-add-field]').forEach(b=>b.onclick=()=>fieldEditor(groups.find(g=>g.group_id===b.dataset.addField)));root.querySelectorAll('[data-edit-field]').forEach(b=>{const [g,f]=b.dataset.editField.split('|'),group=groups.find(x=>x.group_id===g);b.onclick=()=>fieldEditor(group,group.fields.find(x=>x.field_id===f))});root.querySelectorAll('[data-remove-field]').forEach(b=>{const [g,f]=b.dataset.removeField.split('|'),group=groups.find(x=>x.group_id===g);b.onclick=()=>removeField(group,group.fields.find(x=>x.field_id===f))})}
async function refresh(){groups=(await api('/api/admin/advanced-fields')).groups;render()}async function init(){try{await loadTypes();await refresh();note('Los metadatos se guardan con validación tipada.')}catch(x){note(x.message,true)}}$('#new-group').onclick=()=>groupEditor();init();
</script></html>
